<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>HamoudaSpace · Bottom Controls | Full Recording + Live Slides</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-dark: #05070c;
    --bg-card: #12161f;
    --bg-soft: #1a1f2c;
    --border-dim: #2a2f3e;
    --text-primary: #eef2ff;
    --text-secondary: #9ca3af;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
    --success: #22c55e;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  /* LOBBY */
  #view-lobby {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    background: radial-gradient(circle at 20% 30%, #0f121c, #020408);
  }
  .lobby-header {
    padding: 16px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(10, 12, 18, 0.7);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-dim);
  }
  .logo-area { display: flex; gap: 12px; align-items: center; }
  .logo-icon { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .lobby-actions { display: flex; gap: 12px; }
  .btn { padding: 8px 20px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); transform: scale(0.97); }
  .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-dim); }
  .lobby-main { max-width: 700px; margin: 60px auto; padding: 24px; text-align: center; }
  .hero h1 { font-size: 2.4rem; margin-bottom: 12px; }
  .action-cards { display: flex; gap: 24px; justify-content: center; margin-top: 48px; flex-wrap: wrap; }
  .card { background: var(--bg-card); padding: 28px; border-radius: 28px; width: 240px; border: 1px solid var(--border-dim); }
  .card button { margin-top: 16px; width: 100%; }

  /* ROOM: SPLIT LAYOUT - ALL BUTTONS AT BOTTOM */
  #view-room {
    display: none;
    flex-direction: column;
    height: 100vh;
    background: #05070c;
  }

  /* TOP BAR - only room info and action buttons (chat/slides toggle) */
  .room-header {
    background: rgba(8, 10, 16, 0.95);
    backdrop-filter: blur(16px);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    z-index: 10;
  }
  .room-info { display: flex; gap: 12px; align-items: baseline; }
  .room-title { font-weight: 600; font-size: 14px; }
  .room-code {
    font-family: monospace; background: rgba(59,130,246,0.2); padding: 4px 12px;
    border-radius: 40px; font-size: 0.75rem; cursor: pointer;
  }
  .action-buttons { display: flex; gap: 8px; }
  .icon-btn {
    background: rgba(255,255,255,0.06); border: none; padding: 6px 14px;
    border-radius: 30px; color: var(--text-secondary); font-size: 12px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: 0.2s;
  }
  .icon-btn.active { background: var(--accent); color: white; }
  .icon-btn:hover { background: rgba(255,255,255,0.12); color: white; }

  /* UPPER PANEL (Chat or Presentation) */
  .upper-panel {
    background: rgba(16, 20, 28, 0.96);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-dim);
    height: 48%;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .upper-panel.collapsed { display: none; }
  .panel-header {
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.3);
  }
  .panel-title { font-weight: 600; font-size: 13px; }
  .close-upper-btn {
    background: none; border: none; color: var(--text-secondary);
    font-size: 18px; cursor: pointer; padding: 0 8px;
  }
  .close-upper-btn:hover { color: var(--danger); }
  .host-badge { background: var(--accent); padding: 2px 8px; border-radius: 20px; font-size: 9px; margin-left: 8px; }

  /* CHAT VIEW */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .chat-bubble {
    max-width: 75%;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 12px;
    background: var(--bg-soft);
    align-self: flex-start;
  }
  .chat-bubble.me {
    background: var(--accent);
    align-self: flex-end;
  }
  .chat-meta {
    font-size: 9px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.2);
  }
  .chat-input-row input {
    flex: 1;
    background: var(--bg-soft);
    border: none;
    padding: 8px 14px;
    border-radius: 30px;
    color: white;
    outline: none;
    font-size: 12px;
  }
  .send-btn {
    background: var(--accent);
    border: none;
    width: 36px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
  }

  /* PRESENTATION VIEW */
  .pres-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pres-viewer {
    flex: 1;
    background: #000000cc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-height: 0;
    overflow: auto;
  }
  .pres-viewer img, .pres-viewer canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 12px;
  }
  .pres-controls {
    padding: 10px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .pres-controls button {
    background: var(--bg-soft);
    border: none;
    padding: 5px 14px;
    border-radius: 30px;
    color: white;
    font-size: 11px;
    cursor: pointer;
  }
  .pres-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
  .pres-controls button:not(:disabled):hover { background: var(--accent); }
  .pres-progress { flex: 1; height: 3px; background: var(--border-dim); border-radius: 2px; cursor: pointer; }
  .pres-progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 2px; }
  .page-indicator { font-size: 10px; color: var(--text-secondary); min-width: 55px; text-align: center; }
  .upload-mini { background: var(--accent) !important; }

  /* LOWER SECTION: VIDEO GRID */
  .video-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 10px;
    background: #03050a;
  }
  .video-grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    overflow-y: auto;
    padding: 4px;
    height: 100%;
    align-content: center;
  }
  .vtile {
    background: #11161f;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 9 / 16;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .vtile video { width: 100%; height: 100%; object-fit: cover; }
  .vtile .ph {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    background: #0a0e16;
  }
  .avatar-big {
    width: 55px;
    height: 55px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
  }
  .vtile-bar {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
  }
  .vtile-name {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    padding: 3px 10px;
    border-radius: 30px;
    font-size: 10px;
  }

  /* BOTTOM CONTROL BAR - ALL BUTTONS HERE */
  .bottom-controls {
    background: rgba(8, 10, 16, 0.98);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 12px 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-shrink: 0;
    z-index: 20;
  }
  .ctrl-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    font-size: 22px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.02); }
  .ctrl-btn.off { background: var(--danger); }
  .ctrl-btn.leave { background: var(--danger); }
  .ctrl-btn.recording { background: var(--danger); animation: pulse 1s infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e1f2c;
    padding: 8px 20px;
    border-radius: 40px;
    z-index: 400;
    font-size: 12px;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #2a3048;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 600;
  }
  .modal-card {
    background: var(--bg-card); border-radius: 28px; padding: 28px; width: 340px;
  }
  .modal-card input {
    width: 100%; margin-bottom: 12px; background: var(--bg-soft); border: 1px solid var(--border-dim);
    border-radius: 14px; padding: 10px; color: white;
  }
  .badge { background: var(--danger); border-radius: 20px; padding: 2px 6px; font-size: 9px; margin-left: 6px; }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="view-lobby">
  <div class="lobby-header"><div class="logo-area"><div class="logo-icon">🎥</div><div><strong>HamoudaSpace</strong><div style="font-size:11px;">Bottom Controls · Full Recording</div></div></div><div class="lobby-actions"><button class="btn btn-secondary" id="showJoinBtn">🔗 Join</button><button class="btn btn-primary" id="showCreateBtn">✨ New Meeting</button></div></div>
  <div class="lobby-main"><div class="hero"><h1>Video calls + Live Presentations</h1><p>All controls at bottom · Host controls slides · Record full meeting</p></div><div class="action-cards"><div class="card"><h3>Host a meeting</h3><button class="btn btn-primary" id="createCardBtn">Create room</button></div><div class="card"><h3>Join with code</h3><button class="btn btn-secondary" id="joinCardBtn">Enter code</button></div></div></div>
</div>

<!-- MEETING ROOM -->
<div id="view-room">
  <div class="room-header">
    <div class="room-info"><span class="room-title" id="roomNameDisplay">Meeting</span><span class="room-code" id="roomCodeDisplay" onclick="copyRoomCode()">XXXXXX</span></div>
    <div class="action-buttons"><button class="icon-btn" id="chatUpperBtn">💬 Chat <span id="chatUnreadBadge" class="badge" style="display:none;">0</span></button><button class="icon-btn" id="presUpperBtn">📽️ Slides</button><button class="icon-btn" onclick="shareMeetingLink()">🔗 Share</button></div>
  </div>

  <div id="upperPanel" class="upper-panel collapsed">
    <div class="panel-header"><span class="panel-title" id="upperPanelTitle">Chat</span><button class="close-upper-btn" id="closeUpperBtn">✕</button></div>
    <div id="chatView" class="chat-container hidden">
      <div class="chat-messages" id="chatMessagesList"></div>
      <div class="chat-input-row"><input type="text" id="chatInputField" placeholder="Type a message..." maxlength="300"><button class="send-btn" id="sendChatUpperBtn">➤</button></div>
    </div>
    <div id="presView" class="pres-container hidden">
      <div class="pres-viewer" id="presViewer"><div class="pres-empty" style="color:#aaa; text-align:center; padding:20px;">No presentation yet.<br>Host uploads PDF/image</div></div>
      <div class="pres-controls">
        <button id="presPrevBtn" disabled>◀ Prev</button>
        <button id="presNextBtn" disabled>Next ▶</button>
        <div class="pres-progress" id="presProgressBar"><div class="pres-progress-fill" id="presProgressFill"></div></div>
        <span class="page-indicator" id="presPageInfo">0/0</span>
        <button id="presUploadUpperBtn" class="upload-mini">📤 Upload</button>
        <input type="file" id="presFileInput" accept=".pdf,.jpg,.jpeg,.png,.gif" style="display:none">
        <span id="presHostBadge" class="host-badge" style="display:none;">👑 Host</span>
      </div>
    </div>
  </div>

  <div class="video-section"><div class="video-grid" id="videoGridContainer"></div></div>

  <!-- ALL CONTROLS AT THE BOTTOM -->
  <div class="bottom-controls">
    <button class="ctrl-btn" id="micBtn" title="Microphone">🎤</button>
    <button class="ctrl-btn" id="camBtn" title="Camera">📷</button>
    <button class="ctrl-btn" id="recBtn" title="Record Meeting">⏺</button>
    <button class="ctrl-btn leave" id="leaveRoomBtn" title="Leave Meeting">🚪</button>
  </div>
</div>

<!-- MODALS -->
<div id="createModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">New meeting</div><input id="createRoomName" placeholder="Meeting name"><input id="createUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelCreateModal" class="btn btn-secondary">Cancel</button><button id="confirmCreateModal" class="btn btn-primary">Create</button></div></div></div>
<div id="joinModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">Join meeting</div><input id="joinRoomCode" maxlength="6" placeholder="6-letter code" style="text-transform:uppercase"><input id="joinUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelJoinModal" class="btn btn-secondary">Cancel</button><button id="confirmJoinModal" class="btn btn-primary">Join</button></div></div></div>
<div id="loadingOverlay" class="overlay hidden"><div class="spinner"></div><p>Connecting...</p></div>

<script>
  // ========== GLOBAL STATE ==========
  const state = {
    peer: null, localStream: null, calls: new Map(), dataConns: new Map(), participants: new Map(),
    isHost: false, roomCode: '', myName: '', roomName: '',
    isMuted: false, isCamOff: false,
    isRecording: false, mediaRecorder: null, recordedChunks: [], recordingCanvas: null, recordingAnimationId: null, recordingAudioContext: null,
    hostConn: null, keepAliveInterval: null,
    presentation: { pages: [], currentPage: 0, ownerId: null },
    chatUnread: 0, activeUpperPanel: null
  };

  function genCode(){ return Math.random().toString(36).slice(2,8).toUpperCase(); }
  function hostPid(code){ return 'hm-' + code.toLowerCase(); }
  function toast(msg){ let t=document.querySelector('.toast'); if(t)t.remove(); t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
  function showOverlay(msg){ let ov=document.getElementById('loadingOverlay'); ov.classList.remove('hidden'); ov.querySelector('p').innerText=msg; }
  function hideOverlay(){ document.getElementById('loadingOverlay').classList.add('hidden'); }
  function showLobby(){ document.getElementById('view-lobby').style.display='flex'; document.getElementById('view-room').style.display='none'; hideOverlay(); closeAllModals(); if(state.localStream) state.localStream.getTracks().forEach(t=>t.stop()); if(state.recordingAudioContext) state.recordingAudioContext.close(); state.participants.clear(); state.calls.clear(); if(state.keepAliveInterval) clearInterval(state.keepAliveInterval); state.isRecording = false; document.getElementById('recBtn').classList.remove('recording'); }
  function showRoom(){ document.getElementById('view-lobby').style.display='none'; document.getElementById('view-room').style.display='flex'; hideOverlay(); }
  function closeAllModals(){ document.getElementById('createModal').classList.add('hidden'); document.getElementById('joinModal').classList.add('hidden'); }
  function escapeHtml(s){ return String(s).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  // ========== UPPER PANEL LOGIC ==========
  const upperPanel = document.getElementById('upperPanel');
  const chatView = document.getElementById('chatView');
  const presView = document.getElementById('presView');
  const upperTitle = document.getElementById('upperPanelTitle');
  
  function closeUpperPanel(){
    upperPanel.classList.add('collapsed');
    state.activeUpperPanel = null;
    document.getElementById('chatUpperBtn').classList.remove('active');
    document.getElementById('presUpperBtn').classList.remove('active');
  }
  function openChatPanel(){
    if(state.activeUpperPanel === 'chat') { closeUpperPanel(); return; }
    upperPanel.classList.remove('collapsed');
    chatView.classList.remove('hidden');
    presView.classList.add('hidden');
    upperTitle.innerText = '💬 Meeting Chat';
    state.activeUpperPanel = 'chat';
    document.getElementById('chatUpperBtn').classList.add('active');
    document.getElementById('presUpperBtn').classList.remove('active');
    state.chatUnread = 0;
    document.getElementById('chatUnreadBadge').style.display = 'none';
    setTimeout(() => document.getElementById('chatInputField')?.focus(), 100);
    const container = document.getElementById('chatMessagesList');
    if(container) container.scrollTop = container.scrollHeight;
  }
  function openPresPanel(){
    if(state.activeUpperPanel === 'pres') { closeUpperPanel(); return; }
    upperPanel.classList.remove('collapsed');
    presView.classList.remove('hidden');
    chatView.classList.add('hidden');
    upperTitle.innerText = '📽️ Live Presentation (Host Controls)';
    state.activeUpperPanel = 'pres';
    document.getElementById('presUpperBtn').classList.add('active');
    document.getElementById('chatUpperBtn').classList.remove('active');
    if(state.presentation.pages.length) renderPresentationPage(state.presentation.currentPage);
  }
  document.getElementById('chatUpperBtn').onclick = openChatPanel;
  document.getElementById('presUpperBtn').onclick = openPresPanel;
  document.getElementById('closeUpperBtn').onclick = closeUpperPanel;
  
  // ========== CHAT ==========
  function appendChatMessage(msg, isSelf){
    const container = document.getElementById('chatMessagesList');
    const div = document.createElement('div');
    div.className = `chat-bubble ${isSelf ? 'me' : ''}`;
    const time = new Date(msg.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    div.innerHTML = `<div class="chat-meta">${isSelf ? 'You' : escapeHtml(msg.name)} · ${time}</div><div>${escapeHtml(msg.text)}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    if(!isSelf && (state.activeUpperPanel !== 'chat' || upperPanel.classList.contains('collapsed'))){
      state.chatUnread++;
      const badge = document.getElementById('chatUnreadBadge');
      badge.innerText = state.chatUnread > 9 ? '9+' : state.chatUnread;
      badge.style.display = 'inline';
    }
  }
  function sendChatMessage(){
    const input = document.getElementById('chatInputField');
    const text = input.value.trim(); if(!text) return;
    input.value = '';
    const msgObj = { type:'chat', name:state.myName, text, ts:Date.now() };
    appendChatMessage(msgObj, true);
    if(state.isHost) state.dataConns.forEach(c => { if(c.open) c.send(msgObj); });
    else if(state.hostConn?.open) state.hostConn.send(msgObj);
  }
  document.getElementById('sendChatUpperBtn').onclick = sendChatMessage;
  document.getElementById('chatInputField').addEventListener('keypress', e => { if(e.key === 'Enter') sendChatMessage(); });
  
  // ========== PRESENTATION ==========
  async function loadPresentationFile(file){
    if(!state.isHost) { toast('Only host can share'); return null; }
    let pages = [];
    if(file.type.startsWith('image/')){
      const url = URL.createObjectURL(file);
      pages = [{type:'image', url}];
    } else if(file.type === 'application/pdf'){
      const arrayBuf = await file.arrayBuffer();
      const pdfjs = window['pdfjs-dist/build/pdf'];
      if(pdfjs){
        pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const pdf = await pdfjs.getDocument({data:arrayBuf}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({scale:1.2});
          const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
          await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
          pages.push({type:'image', url:canvas.toDataURL()});
        }
      } else { toast("PDF.js loading..."); return null; }
    } else { toast("Upload PDF or image"); return null; }
    return { pages, fileName:file.name };
  }
  function renderPresentationPage(pageNum){
    const viewer = document.getElementById('presViewer');
    const pages = state.presentation.pages;
    if(!pages.length){ viewer.innerHTML = '<div class="pres-empty" style="color:#aaa; text-align:center; padding:20px;">No slides loaded. Host uploads PDF/image</div>'; return; }
    const page = pages[pageNum];
    viewer.innerHTML = '';
    if(page.type === 'image'){ const img = document.createElement('img'); img.src = page.url; viewer.appendChild(img); }
    else viewer.innerHTML = `<div class="pres-empty">Slide preview</div>`;
    document.getElementById('presPageInfo').innerText = `${pageNum+1}/${pages.length}`;
    const fill = document.getElementById('presProgressFill'); if(fill) fill.style.width = `${((pageNum+1)/pages.length)*100}%`;
    document.getElementById('presPrevBtn').disabled = (pageNum === 0);
    document.getElementById('presNextBtn').disabled = (pageNum === pages.length-1);
  }
  function broadcastPresentation(){
    const data = { type:'pres_sync', pages:state.presentation.pages.map(p=>p.type==='image'?{type:'image',url:p.url}:p), currentPage:state.presentation.currentPage, ownerId:state.presentation.ownerId };
    state.dataConns.forEach(conn => { if(conn.open) conn.send(data); });
  }
  async function onFileUpload(e){
    const file = e.target.files[0]; if(!file) return;
    toast('Loading slides...');
    const result = await loadPresentationFile(file);
    if(result && result.pages.length){
      state.presentation = { pages:result.pages, currentPage:0, ownerId:state.peer?.id };
      renderPresentationPage(0);
      broadcastPresentation();
      toast(`Loaded ${result.pages.length} slides - all participants can follow along`);
      if(state.activeUpperPanel !== 'pres') openPresPanel();
    } else toast('Failed to load');
    e.target.value = '';
  }
  function changeSlide(delta){
    if(!state.isHost) { toast('Only host can control slides'); return; }
    const newPage = state.presentation.currentPage + delta;
    if(newPage >= 0 && newPage < state.presentation.pages.length){
      state.presentation.currentPage = newPage;
      renderPresentationPage(newPage);
      broadcastPresentation();
    }
  }
  document.getElementById('presUploadUpperBtn').onclick = () => { if(state.isHost) document.getElementById('presFileInput').click(); else toast('Only host can upload slides'); };
  document.getElementById('presFileInput').addEventListener('change', onFileUpload);
  document.getElementById('presPrevBtn').onclick = () => changeSlide(-1);
  document.getElementById('presNextBtn').onclick = () => changeSlide(1);
  
  // ========== FULL MEETING RECORDING ==========
  async function startFullRecording(){
    if(state.isRecording) return;
    toast('Starting recording of all participants...');
    
    const canvas = document.createElement('canvas');
    canvas.width = 1280;
    canvas.height = 720;
    const ctx = canvas.getContext('2d');
    state.recordingCanvas = canvas;
    
    function drawFrame(){
      if(!state.isRecording) return;
      ctx.fillStyle = '#05070c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      const tiles = document.querySelectorAll('.vtile');
      if(tiles.length === 0){
        state.recordingAnimationId = requestAnimationFrame(drawFrame);
        return;
      }
      const cols = Math.min(Math.ceil(Math.sqrt(tiles.length)), 3);
      const rows = Math.ceil(tiles.length / cols);
      const tileW = canvas.width / cols;
      const tileH = canvas.height / rows;
      
      tiles.forEach((tile, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const video = tile.querySelector('video');
        if(video && video.srcObject && video.readyState >= 2 && video.videoWidth > 0){
          try {
            ctx.drawImage(video, col * tileW, row * tileH, tileW, tileH);
          } catch(e){}
        } else {
          ctx.fillStyle = '#1a1f2c';
          ctx.fillRect(col * tileW, row * tileH, tileW, tileH);
          const nameEl = tile.querySelector('.vtile-name');
          const name = nameEl ? nameEl.innerText : 'Participant';
          ctx.fillStyle = '#3b82f6';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(name.charAt(0).toUpperCase(), col * tileW + tileW/2, row * tileH + tileH/2);
        }
      });
      state.recordingAnimationId = requestAnimationFrame(drawFrame);
    }
    drawFrame();
    
    const canvasStream = canvas.captureStream(30);
    
    const audioContext = new AudioContext();
    state.recordingAudioContext = audioContext;
    const destination = audioContext.createMediaStreamDestination();
    
    const addAudioTrack = (stream) => {
      if(stream && stream.getAudioTracks().length){
        try {
          const source = audioContext.createMediaStreamSource(stream);
          source.connect(destination);
        } catch(e){}
      }
    };
    
    if(state.localStream) addAudioTrack(state.localStream);
    for(let [pid, call] of state.calls){
      if(call.peerConnection){
        const receivers = call.peerConnection.getReceivers();
        receivers.forEach(receiver => {
          if(receiver.track && receiver.track.kind === 'audio'){
            try {
              const stream = new MediaStream([receiver.track]);
              addAudioTrack(stream);
            } catch(e){}
          }
        });
      }
    }
    
    const combinedStream = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...destination.stream.getAudioTracks()
    ]);
    
    const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
    state.recordedChunks = [];
    recorder.ondataavailable = (e) => { if(e.data.size) state.recordedChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `meeting-${state.roomName || state.roomCode}-${new Date().toISOString().slice(0,19)}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Meeting recording saved!');
      if(state.recordingAnimationId) cancelAnimationFrame(state.recordingAnimationId);
      if(state.recordingAudioContext) state.recordingAudioContext.close();
      state.recordingAudioContext = null;
      state.recordingCanvas = null;
    };
    recorder.start(1000);
    state.mediaRecorder = recorder;
    state.isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    toast('Recording all participants (video + audio)...');
  }
  
  function stopFullRecording(){
    if(!state.isRecording) return;
    if(state.mediaRecorder && state.mediaRecorder.state !== 'inactive'){
      state.mediaRecorder.stop();
    }
    state.isRecording = false;
    document.getElementById('recBtn').classList.remove('recording');
  }
  
  function toggleRecording(){
    if(state.isRecording) stopFullRecording();
    else startFullRecording();
  }
  
  // ========== VIDEO GRID & WEBRTC ==========
  const peerConfig = { 
    debug: 0,
    config: { 
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10
    } 
  };
  
  async function getStream(){ 
    try{ 
      return await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } }
      }); 
    } catch(e){ 
      toast('Camera/mic access denied'); 
      return null; 
    } 
  }
  
  function attachCall(call){
    const pid = call.peer; 
    state.calls.set(pid, call);
    call.on('stream', stream => {
      if(!state.participants.has(pid)) state.participants.set(pid, {name:'Guest'});
      const v = document.getElementById(`vid-${pid}`); 
      const ph = document.getElementById(`ph-${pid}`);
      if(v){ 
        v.srcObject = stream; 
        v.style.display = 'block'; 
        if(ph) ph.style.display = 'none'; 
        v.play().catch(e => console.log('play error', e));
      }
    });
    call.on('close', () => handleLeft(pid));
    call.on('error', () => handleLeft(pid));
  }
  
  function handleLeft(pid){
    const p = state.participants.get(pid); 
    if(p) toast(`${p.name} left`);
    state.calls.get(pid)?.close(); 
    state.calls.delete(pid);
    state.dataConns.get(pid)?.close(); 
    state.dataConns.delete(pid);
    state.participants.delete(pid);
    const tile = document.getElementById(`tile-${pid}`); 
    if(tile) tile.remove();
    if(state.isHost) {
      state.dataConns.forEach(c => { if(c.open) c.send({type:'user-left', peerId:pid}); });
    }
  }
  
  function renderGrid(){
    const container = document.getElementById('videoGridContainer');
    container.innerHTML = '';
    container.appendChild(createTile('local', `${state.myName} (you)`, state.localStream, true));
    for(let [pid, p] of state.participants.entries()) {
      container.appendChild(createTile(pid, p.name, null, false));
    }
    const hostBadge = document.getElementById('presHostBadge');
    if(hostBadge) hostBadge.style.display = state.isHost ? 'inline-block' : 'none';
  }
  
  function createTile(id, name, stream, isLocal){
    const tile = document.createElement('div'); 
    tile.className = 'vtile'; 
    tile.id = `tile-${id}`;
    const ph = document.createElement('div'); 
    ph.className = 'ph'; 
    ph.id = `ph-${id}`;
    ph.innerHTML = `<div class="avatar-big">${(name[0]||'?').toUpperCase()}</div>`;
    const video = document.createElement('video'); 
    video.id = `vid-${id}`; 
    video.autoplay = true; 
    video.playsInline = true; 
    video.muted = isLocal;
    if(stream && stream.getVideoTracks().length > 0 && !state.isCamOff){ 
      video.srcObject = stream; 
      video.style.display = 'block'; 
      ph.style.display = 'none'; 
    } else { 
      video.style.display = 'none'; 
      ph.style.display = 'flex'; 
    }
    const bar = document.createElement('div'); 
    bar.className = 'vtile-bar';
    bar.innerHTML = `<div class="vtile-name">${escapeHtml(name)}</div>`;
    if(isLocal && state.isMuted) bar.innerHTML += `<div style="background:#ef4444; border-radius:20px; padding:2px 8px; font-size:10px;">🔇</div>`;
    tile.appendChild(ph); 
    tile.appendChild(video); 
    tile.appendChild(bar);
    return tile;
  }
  
  function startKeepAlive(){
    if(state.keepAliveInterval) clearInterval(state.keepAliveInterval);
    state.keepAliveInterval = setInterval(() => {
      if(state.peer && !state.peer.destroyed){
        state.dataConns.forEach(conn => {
          if(conn.open) {
            try { conn.send({ type: 'ping', ts: Date.now() }); } catch(e) {}
          }
        });
      }
    }, 25000);
  }
  
  // ========== CREATE ROOM ==========
  async function createRoom(){
    const roomName = document.getElementById('createRoomName').value.trim();
    const userName = document.getElementById('createUserName').value.trim();
    if(!roomName || !userName){ toast('Please fill in both fields'); return; }
    closeAllModals(); showOverlay('Creating room...');
    state.isHost = true; state.roomCode = genCode(); state.myName = userName; state.roomName = roomName;
    state.localStream = await getStream();
    if(!state.localStream){ showLobby(); toast('Cannot access camera/microphone'); return; }
    if(state.peer) state.peer.destroy();
    const hostId = hostPid(state.roomCode);
    state.peer = new Peer(hostId, peerConfig);
    const timer = setTimeout(()=>{ if(state.peer) state.peer.destroy(); showLobby(); toast('Connection timeout'); }, 20000);
    state.peer.on('open', () => {
      clearTimeout(timer);
      document.getElementById('roomNameDisplay').innerText = state.roomName;
      document.getElementById('roomCodeDisplay').innerText = state.roomCode;
      renderGrid(); showRoom(); toast(`Room created! Share code: ${state.roomCode}`);
      startKeepAlive();
      state.peer.on('disconnected', () => { if(state.peer && !state.peer.destroyed) { toast('Reconnecting...'); state.peer.reconnect(); } });
    });
    state.peer.on('error', (err) => { clearTimeout(timer); showLobby(); toast('Creation error: ' + (err.message || err.type)); });
    state.peer.on('connection', (conn) => {
      conn.on('open', () => {
        if(state.participants.size >= 20){ conn.send({type:'room-full'}); conn.close(); return; }
        const users = []; for(let [pid,p] of state.participants) users.push({peerId:pid, name:p.name});
        users.push({peerId:state.peer.id, name:state.myName});
        conn.send({ type:'welcome', users, roomName:state.roomName, roomCode:state.roomCode, presentation:state.presentation.pages.length ? { pages:state.presentation.pages.map(p=>p.type==='image'?{type:'image',url:p.url}:p), currentPage:state.presentation.currentPage, ownerId:state.presentation.ownerId } : null });
        state.dataConns.forEach((c,k)=>{ if(k !== conn.peer && c.open) c.send({type:'user-joined', peerId:conn.peer, name:conn.metadata?.name || 'Guest'}); });
        state.dataConns.set(conn.peer, conn);
        state.participants.set(conn.peer, {name: conn.metadata?.name || 'Guest'});
        renderGrid();
        conn.on('data', (msg) => { if(msg.type === 'chat'){ appendChatMessage(msg, false); state.dataConns.forEach(c => { if(c.open && c.peer !== conn.peer) c.send(msg); }); } });
        conn.on('close', () => handleLeft(conn.peer));
      });
    });
    state.peer.on('call', (call) => { if(state.localStream){ call.answer(state.localStream); attachCall(call); } });
  }
  
  // ========== JOIN ROOM ==========
  async function joinRoom(){
    const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
    const userName = document.getElementById('joinUserName').value.trim();
    if(!code || !userName || code.length !== 6){ toast('Valid 6-character code and name required'); return; }
    closeAllModals(); showOverlay('Joining room...');
    if(state.peer) state.peer.destroy();
    if(state.localStream) state.localStream.getTracks().forEach(t=>t.stop());
    if(state.recordingAudioContext) state.recordingAudioContext.close();
    if(state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop();
    state.calls.clear(); state.dataConns.clear(); state.participants.clear();
    state.isRecording = false; document.getElementById('recBtn').classList.remove('recording');
    state.isHost = false; state.roomCode = code; state.myName = userName; state.localStream = await getStream();
    if(!state.localStream){ showLobby(); toast('Cannot access camera/microphone'); return; }
    state.peer = new Peer(peerConfig);
    const timer = setTimeout(()=>{ if(state.peer) state.peer.destroy(); showLobby(); toast('Connection timeout'); }, 20000);
    state.peer.on('error', (err) => { clearTimeout(timer); showLobby(); toast('Join error: ' + (err.message || err.type)); });
    state.peer.on('open', (myPid) => {
      clearTimeout(timer);
      const hostConn = state.peer.connect(hostPid(state.roomCode), { metadata: { name: state.myName }, reliable: true });
      state.hostConn = hostConn;
      const connTimer = setTimeout(()=>{ showLobby(); toast('Host offline or room not found'); }, 15000);
      hostConn.on('open', () => {
        clearTimeout(connTimer);
        hostConn.on('data', (msg) => {
          if(msg.type === 'welcome'){
            state.roomName = msg.roomName; document.getElementById('roomNameDisplay').innerText = msg.roomName; document.getElementById('roomCodeDisplay').innerText = msg.roomCode;
            renderGrid(); showRoom();
            msg.users.forEach(u => { if(u.peerId !== myPid){ state.participants.set(u.peerId, {name:u.name}); const call = state.peer.call(u.peerId, state.localStream); state.calls.set(u.peerId, call); attachCall(call); } });
            if(msg.presentation && msg.presentation.pages){ state.presentation = msg.presentation; renderPresentationPage(state.presentation.currentPage); }
            renderGrid(); toast('Joined successfully!');
          } else if(msg.type === 'user-joined'){ if(msg.peerId === myPid) return; state.participants.set(msg.peerId, {name:msg.name}); const call = state.peer.call(msg.peerId, state.localStream); state.calls.set(msg.peerId, call); attachCall(call); renderGrid(); toast(`${msg.name} joined`); }
          else if(msg.type === 'user-left'){ handleLeft(msg.peerId); }
          else if(msg.type === 'chat'){ appendChatMessage(msg, false); }
          else if(msg.type === 'pres_sync'){ state.presentation = msg; renderPresentationPage(msg.currentPage); if(state.activeUpperPanel === 'pres') renderPresentationPage(msg.currentPage); }
        });
        hostConn.on('close', () => { toast('Host ended the meeting'); leaveRoom(); });
      });
      hostConn.on('error', () => { showLobby(); toast('Failed to connect to host'); });
    });
    state.peer.on('call', (call) => { if(state.localStream){ call.answer(state.localStream); attachCall(call); } });
  }
  
  // ========== MEDIA CONTROLS ==========
  document.getElementById('micBtn').onclick = () => { if(state.localStream){ state.isMuted = !state.isMuted; state.localStream.getAudioTracks().forEach(t=>t.enabled = !state.isMuted); document.getElementById('micBtn').classList.toggle('off', state.isMuted); renderGrid(); } };
  document.getElementById('camBtn').onclick = () => { if(state.localStream){ state.isCamOff = !state.isCamOff; state.localStream.getVideoTracks().forEach(t=>t.enabled = !state.isCamOff); document.getElementById('camBtn').classList.toggle('off', state.isCamOff); renderGrid(); } };
  document.getElementById('recBtn').onclick = toggleRecording;
  
  function leaveRoom(){ 
    if(state.isRecording) stopFullRecording();
    if(state.keepAliveInterval) clearInterval(state.keepAliveInterval);
    state.calls.forEach(c=>c.close()); state.dataConns.forEach(c=>c.close()); if(state.hostConn) state.hostConn.close(); if(state.peer) state.peer.destroy(); if(state.localStream) state.localStream.getTracks().forEach(t=>t.stop()); state.participants.clear(); showLobby(); 
  }
  document.getElementById('leaveRoomBtn').onclick = leaveRoom;
  function copyRoomCode(){ navigator.clipboard.writeText(state.roomCode); toast('Code copied'); }
  function shareMeetingLink(){ const url=window.location.origin+window.location.pathname+'?join='+state.roomCode; navigator.clipboard.writeText(url); toast('Invite link copied'); }
  
  // Modal triggers
  document.getElementById('showCreateBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
  document.getElementById('showJoinBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
  document.getElementById('createCardBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
  document.getElementById('joinCardBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
  document.getElementById('cancelCreateModal').onclick = closeAllModals;
  document.getElementById('cancelJoinModal').onclick = closeAllModals;
  document.getElementById('confirmCreateModal').onclick = createRoom;
  document.getElementById('confirmJoinModal').onclick = joinRoom;
  document.getElementById('joinRoomCode').addEventListener('input', e=> e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));
  
  const urlParams = new URLSearchParams(window.location.search);
  const autoCode = urlParams.get('join');
  if(autoCode && autoCode.length===6) setTimeout(()=>{ document.getElementById('joinRoomCode').value = autoCode.toUpperCase(); document.getElementById('joinModal').classList.remove('hidden'); toast('Enter your name to join'); }, 300);
  
  const scriptPdf = document.createElement('script'); scriptPdf.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js'; document.head.appendChild(scriptPdf);
</script>
