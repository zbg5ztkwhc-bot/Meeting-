<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MeetSpace - Direct Connection</title>
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.0/jsrsasign-all-min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Setup Panel */
        .setup-card {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 450px;
            margin: 60px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .setup-card.hidden {
            display: none;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #1a1a2e;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .success-badge {
            background: #d4edda;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            text-align: center;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .join-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            margin-top: 8px;
        }

        .join-btn:active {
            transform: scale(0.98);
        }

        /* Meeting Area */
        .meeting-container {
            display: none;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
        }

        .meeting-container.active {
            display: block;
        }

        .video-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            min-height: 70vh;
            background: #0f0f1a;
        }

        .video-tile {
            background: #1e1e2e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            font-weight: 500;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #16162a;
        }

        .ctrl-btn {
            background: #2d2d44;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .ctrl-btn.active {
            background: #4f46e5;
        }

        .ctrl-btn.leave {
            background: #dc2626;
        }

        .status-bar {
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #aaa;
            background: #0f0f1a;
        }

        @media (max-width: 768px) {
            .setup-card {
                margin: 30px 16px;
                padding: 24px 20px;
            }
            .ctrl-btn {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .video-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Setup Screen -->
    <div id="setupScreen" class="setup-card">
        <h1>🎥 MeetSpace</h1>
        <div class="subtitle">Video meetings · Powered by LiveKit</div>
        
        <div class="success-badge">
            ✅ Ready to connect! Enter your name below.
        </div>
        
        <div class="input-group">
            <label>👤 Your Name</label>
            <input type="text" id="userName" placeholder="Enter your name" value="Guest">
        </div>
        
        <div class="input-group">
            <label>📁 Room Name</label>
            <input type="text" id="roomName" placeholder="Room name" value="main">
        </div>
        
        <button class="join-btn" id="joinButton">🚀 Join Meeting</button>
        <p style="font-size: 12px; text-align: center; margin-top: 20px; color: #999;">
            🔒 Secure WebRTC · Works on all devices
        </p>
    </div>

    <!-- Meeting Screen -->
    <div id="meetingScreen" class="meeting-container">
        <div id="videoGrid" class="video-wrapper"></div>
        <div class="control-bar">
            <div id="micBtn" class="ctrl-btn active">🎤</div>
            <div id="camBtn" class="ctrl-btn active">📹</div>
            <div id="screenBtn" class="ctrl-btn">🖥️</div>
            <div id="leaveBtn" class="ctrl-btn leave">🚪</div>
        </div>
        <div id="meetingStatus" class="status-bar">🔌 Connecting...</div>
    </div>
</div>

<script>
    // === YOUR CREDENTIALS ===
    const WS_URL = 'wss://meeting-t8djzlpf.livekit.cloud';
    const API_KEY = 'API6VWLgTHiX4vR';
    const API_SECRET = 'wSxeUi1FLtzZ9VJSfhg181qP2klwVlAeb9pwwXTt';
    
    // Global variables
    let livekitRoom = null;
    let myVideoTrack = null;
    let myAudioTrack = null;
    let sharingScreen = null;
    let myStream = null;
    
    // DOM elements
    const setupScreen = document.getElementById('setupScreen');
    const meetingScreen = document.getElementById('meetingScreen');
    const videoGrid = document.getElementById('videoGrid');
    const meetingStatus = document.getElementById('meetingStatus');
    const joinButton = document.getElementById('joinButton');
    const leaveButton = document.getElementById('leaveBtn');
    const micButton = document.getElementById('micBtn');
    const camButton = document.getElementById('camBtn');
    const screenButton = document.getElementById('screenBtn');

    // Generate JWT token
    function createToken(roomName, identity) {
        const now = Math.floor(Date.now() / 1000);
        const exp = now + 6 * 3600; // 6 hours
        
        const payload = {
            "iss": API_KEY,
            "exp": exp,
            "nbf": now,
            "sub": identity,
            "video": {
                "room": roomName,
                "roomJoin": true,
                "canPublish": true,
                "canSubscribe": true,
                "canPublishData": true
            }
        };
        
        const header = { alg: "HS256", typ: "JWT" };
        return KJUR.jws.JWS.sign("HS256", JSON.stringify(header), JSON.stringify(payload), API_SECRET);
    }

    // Add video tile to grid
    function addVideoTile(track, participantName, isMe = false) {
        const tileId = `tile-${participantName.replace(/\s/g, '_')}-${Date.now()}`;
        const tile = document.createElement('div');
        tile.className = 'video-tile';
        tile.id = tileId;
        
        const video = document.createElement('video');
        video.srcObject = new MediaStream([track]);
        video.autoplay = true;
        video.playsInline = true;
        video.muted = isMe; // Mute self to prevent echo
        
        const label = document.createElement('div');
        label.className = 'video-label';
        label.innerText = `${participantName} ${isMe ? '(You)' : ''}`;
        
        tile.appendChild(video);
        tile.appendChild(label);
        videoGrid.appendChild(tile);
        
        return tile;
    }

    // Remove video tile
    function removeVideoTile(participantName) {
        const tiles = document.querySelectorAll(`[id^="tile-${participantName.replace(/\s/g, '_')}"]`);
        tiles.forEach(tile => tile.remove());
    }

    // Clear all tiles except self
    function refreshVideoGrid() {
        const tiles = videoGrid.querySelectorAll('.video-tile');
        tiles.forEach(tile => {
            if (!tile.querySelector('.video-label')?.innerText.includes('(You)')) {
                tile.remove();
            }
        });
    }

    // Join meeting
    async function joinMeeting() {
        const userName = document.getElementById('userName').value.trim() || 'Guest';
        const roomName = document.getElementById('roomName').value.trim() || 'main';
        
        if (!userName) {
            alert('Please enter your name');
            return;
        }
        
        meetingStatus.innerText = '🎤 Requesting camera & microphone...';
        
        try {
            // Get user media
            myStream = await navigator.mediaDevices.getUserMedia({ 
                video: true, 
                audio: true 
            });
            
            const videoTrack = myStream.getVideoTracks()[0];
            const audioTrack = myStream.getAudioTracks()[0];
            
            meetingStatus.innerText = '🔌 Connecting to LiveKit...';
            
            // Generate token
            const token = createToken(roomName, userName);
            
            // Create and connect room
            livekitRoom = new LivekitClient.Room();
            
            // Connect directly
            await livekitRoom.connect(WS_URL, token);
            
            meetingStatus.innerText = `✅ Connected to "${roomName}" as ${userName}`;
            
            // Switch UI
            setupScreen.classList.add('hidden');
            meetingScreen.classList.add('active');
            
            // Publish local tracks
            myVideoTrack = new LivekitClient.LocalVideoTrack(videoTrack);
            myAudioTrack = new LivekitClient.LocalAudioTrack(audioTrack);
            
            await livekitRoom.localParticipant.publishTrack(myVideoTrack);
            await livekitRoom.localParticipant.publishTrack(myAudioTrack);
            
            // Show self video
            addVideoTile(videoTrack, userName, true);
            
            // Handle incoming participants
            livekitRoom.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                meetingStatus.innerText = `👋 ${participant.identity} joined`;
                setTimeout(() => {
                    meetingStatus.innerText = `✅ In room "${roomName}" - ${videoGrid.children.length} participants`;
                }, 2000);
            });
            
            // Handle incoming tracks
            livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === 'video' && track.mediaStreamTrack) {
                    addVideoTile(track.mediaStreamTrack, participant.identity);
                }
            });
            
            // Handle participant leaving
            livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                meetingStatus.innerText = `👋 ${participant.identity} left`;
                removeVideoTile(participant.identity);
            });
            
            // Update participant count when someone joins/leaves
            livekitRoom.on(LivekitClient.RoomEvent.ParticipantConnected, () => {
                setTimeout(() => {
                    meetingStatus.innerText = `✅ ${videoGrid.children.length} participants in room`;
                }, 1000);
            });
            
        } catch (error) {
            console.error('Join error:', error);
            meetingStatus.innerText = `❌ Error: ${error.message}`;
            
            let errorMsg = 'Failed to join meeting.\n\n';
            if (error.name === 'NotAllowedError') {
                errorMsg += 'Please allow camera and microphone access:\n1. Tap the camera/mic icon in address bar\n2. Select "Allow"\n3. Refresh and try again';
            } else if (error.message.includes('WebSocket')) {
                errorMsg += 'Network connection issue. Please check your internet and try again.';
            } else {
                errorMsg += error.message;
            }
            
            alert(errorMsg);
            
            // Clean up
            if (myStream) {
                myStream.getTracks().forEach(track => track.stop());
                myStream = null;
            }
        }
    }

    // Leave meeting
    async function leaveMeeting() {
        if (livekitRoom) {
            livekitRoom.disconnect();
            livekitRoom = null;
        }
        
        if (myVideoTrack) {
            myVideoTrack.stop();
            myVideoTrack = null;
        }
        
        if (myAudioTrack) {
            myAudioTrack.stop();
            myAudioTrack = null;
        }
        
        if (sharingScreen) {
            sharingScreen.stop();
            sharingScreen = null;
        }
        
        if (myStream) {
            myStream.getTracks().forEach(track => track.stop());
            myStream = null;
        }
        
        // Clear video grid
        videoGrid.innerHTML = '';
        
        // Show setup screen
        setupScreen.classList.remove('hidden');
        meetingScreen.classList.remove('active');
        meetingStatus.innerText = '🔌 Disconnected';
    }

    // Toggle microphone
    async function toggleMicrophone() {
        if (myAudioTrack) {
            const isEnabled = myAudioTrack.enabled;
            await myAudioTrack.setEnabled(!isEnabled);
            micButton.style.background = !isEnabled ? '#4f46e5' : '#2d2d44';
            micButton.style.opacity = !isEnabled ? '1' : '0.5';
        }
    }
    
    // Toggle camera
    async function toggleCamera() {
        if (myVideoTrack) {
            const isEnabled = myVideoTrack.enabled;
            await myVideoTrack.setEnabled(!isEnabled);
            camButton.style.background = !isEnabled ? '#4f46e5' : '#2d2d44';
            camButton.style.opacity = !isEnabled ? '1' : '0.5';
            
            // Update video tile visibility
            const selfTile = document.querySelector('[id^="tile-"]:has(.video-label:contains("(You)"))');
            if (selfTile) {
                const video = selfTile.querySelector('video');
                if (video) {
                    video.style.filter = !isEnabled ? 'grayscale(1) blur(2px)' : 'none';
                }
            }
        }
    }
    
    // Screen sharing
    async function toggleScreenShare() {
        if (!livekitRoom) return;
        
        if (sharingScreen) {
            await livekitRoom.localParticipant.unpublishTrack(sharingScreen);
            sharingScreen.stop();
            sharingScreen = null;
            screenButton.style.background = '#2d2d44';
            screenButton.style.opacity = '0.5';
        } else {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenVideoTrack = screenStream.getVideoTracks()[0];
                sharingScreen = new LivekitClient.LocalVideoTrack(screenVideoTrack);
                await livekitRoom.localParticipant.publishTrack(sharingScreen);
                screenButton.style.background = '#4f46e5';
                screenButton.style.opacity = '1';
                
                screenVideoTrack.onended = () => {
                    if (sharingScreen) {
                        livekitRoom.localParticipant.unpublishTrack(sharingScreen);
                        sharingScreen.stop();
                        sharingScreen = null;
                        screenButton.style.background = '#2d2d44';
                        screenButton.style.opacity = '0.5';
                    }
                };
            } catch (err) {
                console.error('Screen share cancelled:', err);
            }
        }
    }

    // Event listeners
    joinButton.addEventListener('click', joinMeeting);
    leaveButton.addEventListener('click', leaveMeeting);
    micButton.addEventListener('click', toggleMicrophone);
    camButton.addEventListener('click', toggleCamera);
    screenButton.addEventListener('click', toggleScreenShare);
</script>
</body>
</html>
