<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MeetSpace - Simple Meeting</title>
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            margin-top: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .card.hidden {
            display: none;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #1a1a2e;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .info {
            background: #e8f0fe;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            text-align: center;
            color: #1a56db;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            margin-top: 8px;
        }

        .meeting-container {
            display: none;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
        }

        .meeting-container.active {
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            min-height: 60vh;
            background: #0f0f1a;
        }

        .participant {
            background: #1e1e2e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
        }

        .participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #16162a;
        }

        .ctrl-btn {
            background: #2d2d44;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            color: white;
        }

        .ctrl-btn.active {
            background: #4f46e5;
        }

        .ctrl-btn.leave {
            background: #dc2626;
        }

        .status {
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #aaa;
            background: #0f0f1a;
        }

        @media (max-width: 768px) {
            .ctrl-btn {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Join Screen -->
    <div id="joinScreen" class="card">
        <h1>🎥 MeetSpace</h1>
        <div class="subtitle">Simple video meetings</div>
        
        <div class="info">
            Enter your name and click Join
        </div>
        
        <div class="input-group">
            <label>Your Name</label>
            <input type="text" id="userName" placeholder="Enter your name" value="Guest">
        </div>
        
        <button id="joinBtn">Join Meeting</button>
    </div>

    <!-- Meeting Screen -->
    <div id="meetingScreen" class="meeting-container">
        <div id="videoGrid" class="video-grid"></div>
        <div class="controls">
            <div id="micCtrl" class="ctrl-btn active">🎤</div>
            <div id="camCtrl" class="ctrl-btn active">📹</div>
            <div id="leaveCtrl" class="ctrl-btn leave">🚪</div>
        </div>
        <div id="statusBar" class="status">Ready</div>
    </div>
</div>

<script>
    // === YOUR CREDENTIALS ===
    // IMPORTANT: Go to LiveKit Cloud → Settings → Token Server → Enable
    // Then copy your Sandbox ID here:
    const SANDBOX_ID = "YOUR_SANDBOX_ID_HERE";  // <--- PASTE YOUR SANDBOX ID HERE
    
    const WS_URL = "wss://meeting-t8djzlpf.livekit.cloud";
    
    let room = null;
    let localVideo = null;
    let localAudio = null;
    
    // Get elements
    const joinScreen = document.getElementById('joinScreen');
    const meetingScreen = document.getElementById('meetingScreen');
    const videoGrid = document.getElementById('videoGrid');
    const statusBar = document.getElementById('statusBar');
    const joinBtn = document.getElementById('joinBtn');
    const leaveCtrl = document.getElementById('leaveCtrl');
    const micCtrl = document.getElementById('micCtrl');
    const camCtrl = document.getElementById('camCtrl');
    
    // Generate token using Sandbox ID (no JWT library needed!)
    // This uses LiveKit's Sandbox token endpoint
    async function getToken(roomName, participantName) {
        // LiveKit Sandbox token endpoint
        const tokenUrl = `https://${SANDBOX_ID}.livekit.cloud/token?room=${encodeURIComponent(roomName)}&identity=${encodeURIComponent(participantName)}`;
        
        try {
            const response = await fetch(tokenUrl);
            if (!response.ok) {
                throw new Error(`Token fetch failed: ${response.status}`);
            }
            const token = await response.text();
            return token;
        } catch (error) {
            console.error('Token error:', error);
            throw new Error('Cannot get token. Make sure Token Server is enabled in LiveKit Cloud Settings.');
        }
    }
    
    // Add video to grid
    function addVideo(track, name, isLocal = false) {
        const container = document.createElement('div');
        container.className = 'participant';
        
        const video = document.createElement('video');
        video.srcObject = new MediaStream([track]);
        video.autoplay = true;
        video.playsInline = true;
        if (isLocal) video.muted = true;
        
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${name} ${isLocal ? '(You)' : ''}`;
        
        container.appendChild(video);
        container.appendChild(label);
        videoGrid.appendChild(container);
        
        return container;
    }
    
    // Clear all videos except self
    function clearOthers() {
        const participants = videoGrid.querySelectorAll('.participant');
        participants.forEach(p => {
            const label = p.querySelector('.label');
            if (label && !label.textContent.includes('(You)')) {
                p.remove();
            }
        });
    }
    
    // Join meeting
    async function join() {
        const userName = document.getElementById('userName').value.trim() || 'Guest';
        const roomName = 'main';
        
        if (!SANDBOX_ID || SANDBOX_ID === 'YOUR_SANDBOX_ID_HERE') {
            alert('Please set your Sandbox ID in the code!\n\nGo to LiveKit Cloud → Settings → Token Server → Enable → Copy Sandbox ID');
            return;
        }
        
        statusBar.textContent = 'Getting camera & mic...';
        
        try {
            // Get media
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0];
            
            statusBar.textContent = 'Getting token...';
            
            // Get token from Sandbox
            const token = await getToken(roomName, userName);
            
            statusBar.textContent = 'Connecting...';
            
            // Create and connect room
            room = new LivekitClient.Room();
            
            await room.connect(WS_URL, token);
            
            // Switch UI
            joinScreen.classList.add('hidden');
            meetingScreen.classList.add('active');
            
            // Publish tracks
            localVideo = new LivekitClient.LocalVideoTrack(videoTrack);
            localAudio = new LivekitClient.LocalAudioTrack(audioTrack);
            
            await room.localParticipant.publishTrack(localVideo);
            await room.localParticipant.publishTrack(localAudio);
            
            // Show self
            addVideo(videoTrack, userName, true);
            
            statusBar.textContent = `✅ Connected as ${userName}`;
            
            // Handle other participants
            room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => {
                statusBar.textContent = `👋 ${p.identity} joined`;
            });
            
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
                if (track.kind === 'video' && track.mediaStreamTrack) {
                    addVideo(track.mediaStreamTrack, participant.identity);
                }
            });
            
            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (p) => {
                statusBar.textContent = `👋 ${p.identity} left`;
                clearOthers();
                if (localVideo) {
                    addVideo(localVideo.mediaStreamTrack, userName, true);
                }
            });
            
        } catch (error) {
            console.error(error);
            statusBar.textContent = `❌ Error: ${error.message}`;
            alert(`Failed to join:\n${error.message}\n\nMake sure Token Server is enabled in LiveKit Cloud.`);
        }
    }
    
    // Leave meeting
    async function leave() {
        if (room) {
            room.disconnect();
            room = null;
        }
        if (localVideo) {
            localVideo.stop();
            localVideo = null;
        }
        if (localAudio) {
            localAudio.stop();
            localAudio = null;
        }
        videoGrid.innerHTML = '';
        joinScreen.classList.remove('hidden');
        meetingScreen.classList.remove('active');
        statusBar.textContent = 'Disconnected';
    }
    
    // Toggle mic
    micCtrl.onclick = async () => {
        if (localAudio) {
            const enabled = !localAudio.enabled;
            await localAudio.setEnabled(enabled);
            micCtrl.style.background = enabled ? '#4f46e5' : '#2d2d44';
            micCtrl.style.opacity = enabled ? '1' : '0.5';
        }
    };
    
    // Toggle cam
    camCtrl.onclick = async () => {
        if (localVideo) {
            const enabled = !localVideo.enabled;
            await localVideo.setEnabled(enabled);
            camCtrl.style.background = enabled ? '#4f46e5' : '#2d2d44';
            camCtrl.style.opacity = enabled ? '1' : '0.5';
        }
    };
    
    leaveCtrl.onclick = leave;
    joinBtn.onclick = join;
</script>
</body>
</html>
