<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>HamoudaSpace · Working Video & Audio</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-dark: #05070c; --bg-card: #12161f; --bg-soft: #1a1f2c;
    --border-dim: #2a2f3e; --text-primary: #eef2ff; --text-secondary: #9ca3af;
    --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --success: #22c55e;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    background: var(--bg-dark); 
    color: var(--text-primary); 
    height: 100vh; 
    overflow: hidden;
  }
  .hidden { display: none !important; }
  .btn { padding: 12px 24px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; font-size: 16px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-dim); }
  #view-lobby { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; background: radial-gradient(circle at 20% 30%, #0f121c, #020408); }
  .lobby-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(10,12,18,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-dim); flex-wrap: wrap; gap: 10px; }
  .logo-area { display: flex; gap: 12px; align-items: center; }
  .logo-icon { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .lobby-actions { display: flex; gap: 10px; }
  .lobby-main { max-width: 700px; margin: 40px auto; padding: 20px; text-align: center; }
  .hero h1 { font-size: 1.6rem; margin-bottom: 12px; }
  .hero p { font-size: 14px; color: var(--text-secondary); }
  .action-cards { display: flex; gap: 16px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  .card { background: var(--bg-card); padding: 24px; border-radius: 28px; width: 220px; border: 1px solid var(--border-dim); }
  .card button { width: 100%; padding: 10px; font-size: 14px; }
  .info-box { margin-top: 30px; padding: 16px; background: rgba(59,130,246,0.1); border-radius: 20px; font-size: 12px; }
  #view-room { display: none; flex-direction: column; height: 100vh; background: #05070c; }
  .room-header { background: rgba(8,10,16,0.95); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
  .room-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .room-title { font-weight: 600; font-size: 12px; }
  .room-code { font-family: monospace; background: rgba(59,130,246,0.2); padding: 4px 10px; border-radius: 40px; font-size: 11px; cursor: pointer; }
  .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; }
  .status-badge.connected { background: rgba(34,197,94,0.3); color: #22c55e; }
  .status-badge.connecting { background: rgba(255,165,0,0.3); color: #ffa500; }
  .recording-indicator { background: var(--danger); padding: 4px 10px; border-radius: 30px; font-size: 10px; display: flex; align-items: center; gap: 6px; animation: pulseRed 1s infinite; }
  @keyframes pulseRed { 0%,100%{opacity:1}50%{opacity:0.5} }
  .upper-panel { background: rgba(16,20,28,0.96); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-dim); height: 45%; min-height: 220px; display: flex; flex-direction: column; flex-shrink: 0; }
  .upper-panel.collapsed { display: none; }
  .panel-header { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.3); }
  .panel-title { font-weight: 600; font-size: 12px; }
  .close-upper-btn { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 0 8px; }
  .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-bubble { max-width: 80%; padding: 8px 12px; border-radius: 18px; font-size: 12px; background: var(--bg-soft); align-self: flex-start; word-break: break-word; }
  .chat-bubble.me { background: var(--accent); align-self: flex-end; }
  .chat-meta { font-size: 9px; color: var(--text-secondary); margin-bottom: 3px; }
  .chat-input-row { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.2); }
  .chat-input-row input { flex: 1; background: var(--bg-soft); border: none; padding: 10px 14px; border-radius: 30px; color: white; outline: none; font-size: 14px; }
  .send-btn { background: var(--accent); border: none; width: 44px; border-radius: 30px; cursor: pointer; font-size: 18px; }
  .pres-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .pres-viewer { flex: 1; background: #000000cc; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: auto; }
  .pres-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
  .pres-controls { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.4); flex-shrink: 0; }
  .pres-controls button { background: var(--bg-soft); border: none; padding: 6px 12px; border-radius: 30px; color: white; font-size: 11px; cursor: pointer; }
  .pres-progress { flex: 1; height: 3px; background: var(--border-dim); border-radius: 2px; cursor: pointer; }
  .pres-progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 2px; }
  .page-indicator { font-size: 10px; color: var(--text-secondary); min-width: 50px; text-align: center; }
  .upload-mini { background: var(--accent) !important; }
  .video-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px; background: #03050a; }
  .video-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); overflow-y: auto; padding: 4px; height: 100%; align-content: start; }
  .vtile { background: #11161f; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 4/3; border: 1px solid rgba(255,255,255,0.08); }
  .vtile video { width: 100%; height: 100%; object-fit: cover; }
  .vtile .ph { display: flex; align-items: center; justify-content: center; height: 100%; background: #0a0e16; }
  .avatar-big { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
  .vtile-bar { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; }
  .vtile-name { background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); padding: 3px 8px; border-radius: 30px; font-size: 9px; }
  .bottom-controls { background: rgba(8,10,16,0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); padding: 10px 12px; display: flex; justify-content: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
  .ctrl-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; font-size: 22px; cursor: pointer; }
  .ctrl-btn:active { transform: scale(0.95); }
  .ctrl-btn.off { background: var(--danger); }
  .ctrl-btn.leave { background: var(--danger); }
  .ctrl-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
  .ctrl-btn.secondary { background: rgba(59,130,246,0.2); }
  .divider { width: 1px; height: 30px; background: rgba(255,255,255,0.15); margin: 0 4px; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.6} }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1e1f2c; padding: 8px 18px; border-radius: 40px; z-index: 400; font-size: 12px; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 500; flex-direction: column; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #2a3048; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 600; padding: 20px; }
  .modal-card { background: var(--bg-card); border-radius: 28px; padding: 24px; width: 90%; max-width: 340px; }
  .modal-card input { width: 100%; margin-bottom: 12px; background: var(--bg-soft); border: 1px solid var(--border-dim); border-radius: 14px; padding: 12px; color: white; font-size: 16px; }
  .badge { background: var(--danger); border-radius: 20px; padding: 2px 6px; font-size: 9px; margin-left: 6px; }
  @media (max-width: 480px) {
    .ctrl-btn { width: 44px; height: 44px; font-size: 18px; }
    .video-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
</style>
</head>
<body>

<div id="view-lobby">
  <div class="lobby-header">
    <div class="logo-area"><div class="logo-icon">🎥</div><div><strong>HamoudaSpace</strong><div style="font-size:10px;">Sync Bug Fixed</div></div></div>
    <div class="lobby-actions">
      <button class="btn btn-secondary" id="showJoinBtn">🔗 Join</button>
      <button class="btn btn-primary" id="showCreateBtn">✨ New Meeting</button>
    </div>
  </div>
  <div class="lobby-main">
    <div class="hero"><h1>Video Meetings That Work</h1><p>Fixed Discovery - Participants now see each other.</p></div>
    <div class="action-cards">
      <div class="card"><h3>Start a Meeting</h3><button class="btn btn-primary" id="createCardBtn">Create Room</button></div>
      <div class="card"><h3>Join a Meeting</h3><button class="btn btn-secondary" id="joinCardBtn">Enter Code</button></div>
    </div>
  </div>
</div>

<div id="view-room">
  <div class="room-header">
    <div class="room-info"><span class="room-title" id="roomNameDisplay">Meeting</span><span class="room-code" id="roomCodeDisplay" onclick="copyRoomCode()">XXXXXX</span></div>
    <div class="room-info"><span id="participantCount">👥 1</span><span id="connectionStatus" class="status-badge connecting">🟡 Connecting...</span></div>
    <div id="recIndicator" class="recording-indicator hidden">🔴 REC</div>
  </div>
  <div id="upperPanel" class="upper-panel collapsed">
    <div class="panel-header"><span class="panel-title" id="upperPanelTitle">Chat</span><button class="close-upper-btn" id="closeUpperBtn">✕</button></div>
    <div id="chatView" class="chat-container hidden"><div class="chat-messages" id="chatMessagesList"></div><div class="chat-input-row"><input type="text" id="chatInputField" placeholder="Type a message..."><button class="send-btn" id="sendChatUpperBtn">➤</button></div></div>
    <div id="presView" class="pres-container hidden"><div class="pres-viewer" id="presViewer"><div style="color:#aaa; text-align:center; padding:20px;">No presentation</div></div><div class="pres-controls"><button id="presPrevBtn" disabled>◀</button><button id="presNextBtn" disabled>▶</button><div class="pres-progress"><div class="pres-progress-fill" id="presProgressFill"></div></div><span class="page-indicator" id="presPageInfo">0/0</span><button id="presUploadBtn" class="upload-mini">📤 Upload</button><input type="file" id="presFileInput" accept="image/*" style="display:none"><span id="presHostBadge" style="background:var(--accent); padding:2px 8px; border-radius:20px; font-size:9px;">👑 Host</span></div></div>
  </div>
  <div class="video-section"><div class="video-grid" id="videoGridContainer"></div></div>
  <div class="bottom-controls">
    <button class="ctrl-btn" id="micBtn">🎤</button>
    <button class="ctrl-btn" id="camBtn">📷</button>
    <button class="ctrl-btn" id="recBtn">⏺</button>
    <div class="divider"></div>
    <button class="ctrl-btn secondary" id="chatBottomBtn">💬 <span id="chatBadge" class="badge" style="display:none;">0</span></button>
    <button class="ctrl-btn secondary" id="presBottomBtn">📽️</button>
    <button class="ctrl-btn secondary" id="shareBtn">🔗</button>
    <div class="divider"></div>
    <button class="ctrl-btn leave" id="leaveRoomBtn">🚪</button>
  </div>
</div>

<div id="createModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">New Meeting</div><input id="createRoomName" placeholder="Meeting name"><input id="createUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelCreateModal" class="btn btn-secondary">Cancel</button><button id="confirmCreateModal" class="btn btn-primary">Create</button></div></div></div>
<div id="joinModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">Join Meeting</div><input id="joinRoomCode" maxlength="6" placeholder="6-letter code" style="text-transform:uppercase"><input id="joinUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelJoinModal" class="btn btn-secondary">Cancel</button><button id="confirmJoinModal" class="btn btn-primary">Join</button></div></div></div>
<div id="loadingOverlay" class="overlay hidden"><div class="spinner"></div><p>Starting camera...</p></div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCra3IgsAaQlf3INjRn04DdX3KWwb8zdlo",
  authDomain: "hamoudaspace-meetingapp.firebaseapp.com",
  projectId: "hamoudaspace-meetingapp",
  storageBucket: "hamoudaspace-meetingapp.firebasestorage.app",
  messagingSenderId: "9931981197",
  appId: "1:9931981197:web:716e61223950d3d39c7dc4"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// State
let localStream = null;
let peerConnections = new Map();
let pendingCandidates = new Map(); 
let participants = new Map(); 
let isHost = false;
let roomCode = '';
let myName = '';
let roomName = '';
let myPeerId = '';
let isMuted = false;
let isCamOff = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let unsubscribe = null; 
let chatUnread = 0;
let activeUpperPanel = null;
let presentation = { pages: [], currentPage: 0 };

// ICE Servers
const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function genCode() { return Math.random().toString(36).slice(2,8).toUpperCase(); }
function genPeerId() { return 'p_' + Math.random().toString(36).slice(2,10); }

function toast(msg) { 
  let t = document.querySelector('.toast'); 
  if(t) t.remove(); 
  t = document.createElement('div'); 
  t.className = 'toast'; 
  t.innerText = msg; 
  document.body.appendChild(t); 
  setTimeout(() => t.remove(), 3000); 
}

function showOverlay(msg) { 
  let ov = document.getElementById('loadingOverlay'); 
  ov.classList.remove('hidden'); 
  ov.querySelector('p').innerText = msg; 
}
function hideOverlay() { document.getElementById('loadingOverlay').classList.add('hidden'); }

function showLobby() { 
  document.getElementById('view-lobby').style.display = 'flex'; 
  document.getElementById('view-room').style.display = 'none'; 
  hideOverlay(); 
  closeAllModals(); 
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  if(unsubscribe) unsubscribe();
  peerConnections.forEach(pc => pc.close());
  peerConnections.clear();
  pendingCandidates.clear();
  participants.clear();
  document.getElementById('videoGridContainer').innerHTML = ''; 
  if(isRecording) stopRecording();
}

function showRoom() { 
  document.getElementById('view-lobby').style.display = 'none'; 
  document.getElementById('view-room').style.display = 'flex'; 
  hideOverlay(); 
}

function closeAllModals() { 
  document.getElementById('createModal').classList.add('hidden'); 
  document.getElementById('joinModal').classList.add('hidden'); 
}

function escapeHtml(s) { 
  return String(s).replace(/[&<>]/g, function(m) { 
    if(m === '&') return '&amp;'; 
    if(m === '<') return '&lt;'; 
    if(m === '>') return '&gt;'; 
    return m; 
  }); 
}

function updateParticipantCount() { 
  document.getElementById('participantCount').innerHTML = `👥 ${participants.size + 1}`; 
}

// UI Panels
const upperPanel = document.getElementById('upperPanel');
const chatView = document.getElementById('chatView');
const presView = document.getElementById('presView');

function closeUpperPanel() { upperPanel.classList.add('collapsed'); activeUpperPanel = null; }
function openChatPanel() { 
  if(activeUpperPanel === 'chat') { closeUpperPanel(); return; } 
  upperPanel.classList.remove('collapsed'); 
  chatView.classList.remove('hidden'); 
  presView.classList.add('hidden'); 
  activeUpperPanel = 'chat'; 
  chatUnread = 0; 
  document.getElementById('chatBadge').style.display = 'none'; 
  setTimeout(() => document.getElementById('chatInputField')?.focus(), 100); 
}
function openPresPanel() { 
  if(activeUpperPanel === 'pres') { closeUpperPanel(); return; } 
  upperPanel.classList.remove('collapsed'); 
  presView.classList.remove('hidden'); 
  chatView.classList.add('hidden'); 
  activeUpperPanel = 'pres'; 
  if(presentation.pages.length) renderPresentationPage(presentation.currentPage); 
}

document.getElementById('chatBottomBtn').onclick = openChatPanel;
document.getElementById('presBottomBtn').onclick = openPresPanel;
document.getElementById('closeUpperBtn').onclick = closeUpperPanel;
document.getElementById('shareBtn').onclick = () => {
    const url = window.location.origin + window.location.pathname + '?join=' + roomCode; 
    navigator.clipboard.writeText(url); 
    toast('Link copied'); 
};

// Chat
function appendChatMessage(msg, isSelf) {
  const container = document.getElementById('chatMessagesList');
  const div = document.createElement('div'); 
  div.className = `chat-bubble ${isSelf ? 'me' : ''}`;
  const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = `<div class="chat-meta">${isSelf ? 'You' : escapeHtml(msg.name)} · ${time}</div><div>${escapeHtml(msg.text)}</div>`;
  container.appendChild(div); 
  container.scrollTop = container.scrollHeight;
  if(!isSelf && (activeUpperPanel !== 'chat' || upperPanel.classList.contains('collapsed'))) { 
    chatUnread++; 
    document.getElementById('chatBadge').innerText = chatUnread > 9 ? '9+' : chatUnread; 
    document.getElementById('chatBadge').style.display = 'inline'; 
  }
}

function sendChatMessage() {
  const input = document.getElementById('chatInputField'); 
  const text = input.value.trim(); 
  if(!text) return;
  input.value = ''; 
  const msgObj = { type: 'chat', name: myName, text, ts: Date.now() };
  appendChatMessage(msgObj, true);
  sendToRoom(msgObj);
}

document.getElementById('sendChatUpperBtn').onclick = sendChatMessage;
document.getElementById('chatInputField').addEventListener('keypress', e => { if(e.key === 'Enter') sendChatMessage(); });

// Presentation
function renderPresentationPage(pageNum) {
  const viewer = document.getElementById('presViewer');
  const pages = presentation.pages;
  if(!pages.length) { viewer.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">No slides</div>'; return; }
  viewer.innerHTML = '';
  const img = document.createElement('img'); 
  img.src = pages[pageNum].url; 
  viewer.appendChild(img);
  document.getElementById('presPageInfo').innerText = `${pageNum+1}/${pages.length}`;
  document.getElementById('presProgressFill').style.width = `${((pageNum+1)/pages.length)*100}%`;
  document.getElementById('presPrevBtn').disabled = (pageNum === 0);
  document.getElementById('presNextBtn').disabled = (pageNum === pages.length-1);
}

document.getElementById('presFileInput').addEventListener('change', async (e) => {
  const file = e.target.files; 
  if(!file || !isHost) return;
  if(file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = function(event) {
        presentation = { pages: [{ url: event.target.result, type: 'image' }], currentPage: 0 };
        renderPresentationPage(0);
        sendToRoom({ type: 'pres_sync', pages: presentation.pages, currentPage: 0 });
        toast('Presentation shared');
        if(activeUpperPanel !== 'pres') openPresPanel();
    }
    reader.readAsDataURL(file);
  }
  e.target.value = '';
});

function changeSlide(delta) {
  if(!isHost) return;
  const newPage = presentation.currentPage + delta;
  if(newPage >= 0 && newPage < presentation.pages.length) {
    presentation.currentPage = newPage;
    renderPresentationPage(newPage);
    sendToRoom({ type: 'pres_sync', pages: presentation.pages, currentPage: newPage });
  }
}
document.getElementById('presUploadBtn').onclick = () => { if(isHost) document.getElementById('presFileInput').click(); else toast('Host only'); };
document.getElementById('presPrevBtn').onclick = () => changeSlide(-1);
document.getElementById('presNextBtn').onclick = () => changeSlide(1);

// ========== UNIVERSAL RECORDING ==========
async function startRecording() {
  if(isRecording) return;
  toast('Starting recording...');
  isRecording = true;
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recIndicator').classList.remove('hidden');
  recordedChunks = [];
  
  let captureStream;
  try {
      if (navigator.mediaDevices.getDisplayMedia) {
          captureStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      }
  } catch(e) {
      console.log('Screen capture rejected or unsupported, falling back to local camera');
  }

  if(!captureStream) {
      captureStream = localStream; 
      toast('Screen record unsupported. Recording your camera only.');
  }

  const options = [
      'video/mp4',
      'video/webm;codecs=h264,opus', 
      'video/webm' 
  ];
  
  let mimeType = '';
  for (let opt of options) {
      if (MediaRecorder.isTypeSupported(opt)) {
          mimeType = opt;
          break;
      }
  }

  const recorder = new MediaRecorder(captureStream, { mimeType: mimeType });
  recorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
  
  recorder.onstop = () => {
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: mimeType || 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); 
    a.href = url; 
    a.download = `Meeting-${roomCode}.${ext}`; 
    a.click();
    URL.revokeObjectURL(url);
    toast('Recording saved successfully!');
  };

  recorder.start(1000);
  mediaRecorder = recorder;
  
  if(captureStream !== localStream) {
      captureStream.getVideoTracks().onended = () => { stopRecording(); };
  }
}

function stopRecording() { 
  if(isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') { 
    mediaRecorder.stop(); 
  } 
  isRecording = false; 
  document.getElementById('recBtn').classList.remove('recording'); 
  document.getElementById('recIndicator').classList.add('hidden');
}

document.getElementById('recBtn').onclick = () => { if(isRecording) stopRecording(); else startRecording(); };

// ========== FIREBASE SIGNALING ==========
async function sendToRoom(data) {
  if(!roomCode) return;
  await db.collection('rooms').doc(roomCode).collection('signals').add({
    from: myPeerId,
    data: data,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
}

// ========== WEBRTC ==========
async function createPeerConnection(targetId) {
  const pc = new RTCPeerConnection(ICE_SERVERS);
  peerConnections.set(targetId, pc);
  pendingCandidates.set(targetId, []);
  
  if(localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }
  
  pc.ontrack = (event) => {
    document.getElementById('connectionStatus').className = 'status-badge connected';
    document.getElementById('connectionStatus').innerHTML = '🟢 Connected';
    
    if (participants.has(targetId)) {
        participants.get(targetId).stream = event.streams;
        
        const videoEl = document.getElementById(`vid-${targetId}`);
        if(videoEl) {
          videoEl.srcObject = event.streams;
          videoEl.play().catch(e => console.log(e));
          const ph = document.getElementById(`ph-${targetId}`);
          if(ph) ph.style.display = 'none';
          videoEl.style.display = 'block';
        }
    }
  };
  
  pc.onicecandidate = (event) => {
    if(event.candidate) {
      sendToRoom({ type: 'candidate', candidate: event.candidate, target: targetId });
    }
  };
  
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  sendToRoom({ type: 'offer', sdp: offer, target: targetId });
  
  return pc;
}

async function processPendingCandidates(targetId, pc) {
    const candidates = pendingCandidates.get(targetId) || [];
    for(let candidate of candidates) {
        try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } 
        catch(e) { console.error('Error adding queued ICE candidate', e); }
    }
    pendingCandidates.set(targetId, []); 
}

async function handleMessage(from, data) {
  if(data.target && data.target !== myPeerId) return;
  
  let pc = peerConnections.get(from);
  
  if(data.type === 'offer' && !pc) {
    pc = new RTCPeerConnection(ICE_SERVERS);
    peerConnections.set(from, pc);
    pendingCandidates.set(from, []);
    
    if(localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }
    
    pc.ontrack = (event) => {
      document.getElementById('connectionStatus').className = 'status-badge connected';
      document.getElementById('connectionStatus').innerHTML = '🟢 Connected';
      
      if (participants.has(from)) {
          participants.get(from).stream = event.streams;
          
          const videoEl = document.getElementById(`vid-${from}`);
          if(videoEl) {
            videoEl.srcObject = event.streams;
            videoEl.play().catch(e => console.log(e));
            const ph = document.getElementById(`ph-${from}`);
            if(ph) ph.style.display = 'none';
            videoEl.style.display = 'block';
          }
      }
    };
    
    pc.onicecandidate = (event) => {
      if(event.candidate) {
        sendToRoom({ type: 'candidate', candidate: event.candidate, target: from });
      }
    };
  }
  
  if(!pc) return;
  
  try {
    if(data.type === 'offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendToRoom({ type: 'answer', sdp: answer, target: from });
      await processPendingCandidates(from, pc);
    } 
    else if(data.type === 'answer') {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      await processPendingCandidates(from, pc);
    } 
    else if(data.type === 'candidate') {
      if(pc.remoteDescription) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      } else {
        if(!pendingCandidates.has(from)) pendingCandidates.set(from, []);
        pendingCandidates.get(from).push(data.candidate);
      }
    }
    else if(data.type === 'chat') {
      appendChatMessage(data, false);
    }
    else if(data.type === 'pres_sync') {
      presentation = { pages: data.pages, currentPage: data.currentPage };
      renderPresentationPage(data.currentPage);
    }
  } catch(e) {
    console.error('Signal error:', e);
  }
}

// ========== ROOM SETUP (FIXED DISCOVERY) ==========
async function setupRoom() {
  const roomRef = db.collection('rooms').doc(roomCode);
  
  // 1. Add self to participants collection
  await roomRef.collection('participants').doc(myPeerId).set({
    name: myName,
    isHost: isHost,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  // 2. LISTEN DIRECTLY TO THE PARTICIPANTS SUBCOLLECTION
  const unsubParticipants = roomRef.collection('participants').onSnapshot((snapshot) => {
    const currentParticipants = new Set();
    
    snapshot.docs.forEach(doc => {
      const pid = doc.id;
      if(pid === myPeerId) return;
      currentParticipants.add(pid);
      
      // If we see a new person we haven't tracked yet
      if(!participants.has(pid)) {
        const data = doc.data();
        participants.set(pid, { name: data.name, stream: null }); 
        renderGrid();
        updateParticipantCount();
        toast(`${data.name} joined`);
        
        // Ensure only one side initiates the WebRTC offer
        if(myPeerId < pid) {
            createPeerConnection(pid);
        }
      }
    });
    
    // Cleanup users who left
    for(let [pid] of participants) {
      if(!currentParticipants.has(pid)) {
        const pc = peerConnections.get(pid);
        if(pc) pc.close();
        peerConnections.delete(pid);
        pendingCandidates.delete(pid);
        participants.delete(pid);
        renderGrid(); 
        updateParticipantCount();
      }
    }
  });
  
  // 3. Listen to signals subcollection
  const unsubSignals = roomRef.collection('signals').orderBy('timestamp').onSnapshot((snapshot) => {
    snapshot.docChanges().forEach(async (change) => {
      if(change.type === 'added') {
        const signal = change.doc.data();
        if(signal.from !== myPeerId) {
          await handleMessage(signal.from, signal.data);
        }
        try { await change.doc.ref.delete(); } catch(e) {}
      }
    });
  });
  
  // Combine unsubscriptions so we can properly close both when leaving
  unsubscribe = () => {
      unsubParticipants();
      unsubSignals();
  };
  
  document.getElementById('connectionStatus').className = 'status-badge connecting';
  document.getElementById('connectionStatus').innerHTML = '🟡 Waiting for participants...';
}

// ========== BANDWIDTH OPTIMIZATION ==========
async function getOptimizedMedia() {
    return await navigator.mediaDevices.getUserMedia({ 
      audio: { echoCancellation: true, noiseSuppression: true }, 
      video: { 
          width: { ideal: 320, max: 640 }, 
          height: { ideal: 240, max: 480 },
          frameRate: { ideal: 15, max: 30 }
      } 
    });
}

// ========== CREATE ROOM ==========
async function createRoom() {
  const roomNameInput = document.getElementById('createRoomName').value.trim();
  const userName = document.getElementById('createUserName').value.trim();
  if(!roomNameInput || !userName) { toast('Fill all fields'); return; }
  closeAllModals(); 
  showOverlay('Starting camera...');
  
  isHost = true;
  roomCode = genCode();
  myName = userName;
  roomName = roomNameInput;
  myPeerId = genPeerId();
  
  try {
    localStream = await getOptimizedMedia();
  } catch(e) {
    showLobby(); 
    toast('Camera/microphone access required');
    return;
  }
  
  await db.collection('rooms').doc(roomCode).set({
    name: roomName,
    host: myPeerId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  document.getElementById('roomNameDisplay').innerText = roomName;
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  renderGrid(); 
  showRoom(); 
  toast(`Room created! Share code: ${roomCode}`);
  
  await setupRoom();
}

// ========== JOIN ROOM ==========
async function joinRoom() {
  const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
  const userName = document.getElementById('joinUserName').value.trim();
  if(!code || !userName || code.length !== 6) { toast('Valid 6-character code required'); return; }
  closeAllModals(); 
  showOverlay('Starting camera...');
  
  const roomDoc = await db.collection('rooms').doc(code).get();
  if(!roomDoc.exists) {
    showLobby();
    toast('Room not found');
    return;
  }
  
  isHost = false;
  roomCode = code;
  myName = userName;
  roomName = roomDoc.data().name;
  myPeerId = genPeerId();
  
  try {
    localStream = await getOptimizedMedia();
  } catch(e) {
    showLobby(); 
    toast('Camera/microphone access required');
    return;
  }
  
  document.getElementById('roomNameDisplay').innerText = roomName;
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  renderGrid(); 
  showRoom();
  toast(`Joined ${roomName}`);
  
  await setupRoom();
}

// ========== SMART VIDEO GRID ==========
function renderGrid() {
  const container = document.getElementById('videoGridContainer');
  
  if (!document.getElementById('tile-local')) {
      container.appendChild(createTile('local', `${myName} (you)`, localStream, true));
  }
  
  for(let [peerId, p] of participants.entries()) {
      if (!document.getElementById(`tile-${peerId}`)) {
          container.appendChild(createTile(peerId, p.name, p.stream, false));
      }
  }
  
  Array.from(container.children).forEach(child => {
      if (child.id === 'tile-local') return;
      const peerId = child.id.replace('tile-', '');
      if (!participants.has(peerId)) {
          child.remove();
      }
  });

  updateParticipantCount();
  document.getElementById('presHostBadge').style.display = isHost ? 'inline-block' : 'none';
}

function createTile(id, name, stream, isLocal) {
  const tile = document.createElement('div'); 
  tile.className = 'vtile'; 
  tile.id = `tile-${id}`;
  
  const ph = document.createElement('div'); 
  ph.className = 'ph'; 
  ph.id = `ph-${id}`;
  ph.innerHTML = `<div class="avatar-big">${(name || '?').toUpperCase()}</div>`;
  
  const video = document.createElement('video'); 
  video.id = `vid-${id}`; 
  video.autoplay = true; 
  video.playsInline = true; 
  video.muted = isLocal;
  
  if(stream && stream.getVideoTracks().length > 0 && !isCamOff) { 
    video.srcObject = stream; 
    video.style.display = 'block'; 
    ph.style.display = 'none'; 
    video.play().catch(e => console.log(e));
  } else { 
    video.style.display = 'none'; 
    ph.style.display = 'flex'; 
  }
  
  const bar = document.createElement('div'); 
  bar.className = 'vtile-bar';
  bar.innerHTML = `<div class="vtile-name">${escapeHtml(name)}</div>`;
  if(isLocal && isMuted) bar.innerHTML += `<div style="background:#ef4444; border-radius:20px; padding:2px 6px; font-size:9px;">🔇</div>`;
  
  tile.appendChild(ph); 
  tile.appendChild(video); 
  tile.appendChild(bar);
  return tile;
}

// Media Controls
document.getElementById('micBtn').onclick = () => { 
  if(localStream) { 
    isMuted = !isMuted; 
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); 
    document.getElementById('micBtn').classList.toggle('off', isMuted);
  } 
};

document.getElementById('camBtn').onclick = () => { 
  if(localStream) { 
    isCamOff = !isCamOff; 
    localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff); 
    document.getElementById('camBtn').classList.toggle('off', isCamOff); 
  } 
};

function leaveRoom() { 
  if(isRecording) stopRecording();
  if(unsubscribe) unsubscribe();
  if(roomCode && myPeerId) {
    db.collection('rooms').doc(roomCode).collection('participants').doc(myPeerId).delete().catch(()=>{});
  }
  peerConnections.forEach(pc => pc.close());
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  participants.clear();
  peerConnections.clear();
  pendingCandidates.clear();
  showLobby(); 
}

document.getElementById('leaveRoomBtn').onclick = leaveRoom;
function copyRoomCode() { navigator.clipboard.writeText(roomCode); toast('Code copied'); }

// Modal triggers
document.getElementById('showCreateBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
document.getElementById('showJoinBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
document.getElementById('createCardBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
document.getElementById('joinCardBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
document.getElementById('cancelCreateModal').onclick = closeAllModals;
document.getElementById('cancelJoinModal').onclick = closeAllModals;
document.getElementById('confirmCreateModal').onclick = createRoom;
document.getElementById('confirmJoinModal').onclick = joinRoom;
document.getElementById('joinRoomCode').addEventListener('input', e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''));

// Auto-join from URL
const urlParams = new URLSearchParams(window.location.search);
const autoCode = urlParams.get('join');
if(autoCode && autoCode.length === 6) setTimeout(() => { 
  document.getElementById('joinRoomCode').value = autoCode.toUpperCase(); 
  document.getElementById('joinModal').classList.remove('hidden'); 
  toast('Enter your name to join'); 
}, 300);
</script>
