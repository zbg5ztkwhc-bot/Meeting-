<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiveKit Meeting Room - Fixed</title>
    <!-- LiveKit Client SDK -->
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <!-- JWT library for token generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.0/jsrsasign-all-min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .setup-panel {
            padding: 24px;
            background: #16162a;
            border-bottom: 1px solid #2a2a3e;
        }

        .setup-panel.hidden {
            display: none;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a12;
            border: 1px solid #2c2c40;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        button:hover {
            background: #6366f1;
            transform: scale(1.02);
        }

        button.danger {
            background: #dc2626;
        }

        button.danger:hover {
            background: #ef4444;
        }

        .meeting-area {
            display: none;
            flex-direction: column;
            height: 80vh;
            min-height: 500px;
        }

        .meeting-area.active {
            display: flex;
        }

        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            overflow-y: auto;
            background: #0a0a12;
        }

        .participant {
            background: #1e1e2e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 1px solid #2d2d42;
        }

        .participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #2a2a3a;
        }

        .participant .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #16162a;
            border-top: 1px solid #2a2a3e;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #2d2d44;
            width: 56px;
            height: 56px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .control-btn.active {
            background: #4f46e5;
        }

        .control-btn.leave {
            background: #dc2626;
        }

        .status {
            text-align: center;
            padding: 12px;
            font-size: 0.85rem;
            color: #aaa;
            background: #0f0f1a;
        }

        .info-badge {
            background: #2a2a3e;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            text-align: center;
            border-left: 4px solid #4f46e5;
        }

        .info-badge a {
            color: #818cf8;
        }

        @media (max-width: 700px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .control-btn {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Setup Panel -->
    <div id="setupPanel" class="setup-panel">
        <div class="info-badge">
            🎥 <strong>LiveKit Meeting Room</strong> — Get credentials from <a href="https://cloud.livekit.io" target="_blank">cloud.livekit.io</a><br>
            Project → Settings → <strong>API Keys</strong> → Create API Key → Copy <strong>API Key</strong>, <strong>API Secret</strong>, and <strong>WebSocket URL</strong>
        </div>
        <div class="form-group">
            <div class="input-field">
                <label>🔑 API Key (Sandbox ID)</label>
                <input type="text" id="apiKey" placeholder="e.g., API key from LiveKit">
            </div>
            <div class="input-field">
                <label>🔒 API Secret</label>
                <input type="password" id="apiSecret" placeholder="Your API secret">
            </div>
            <div class="input-field">
                <label>🌐 WebSocket URL</label>
                <input type="text" id="wsUrl" placeholder="wss://your-project.livekit.cloud">
            </div>
            <div class="input-field">
                <label>👤 Your Name</label>
                <input type="text" id="userName" placeholder="Your name" value="User">
            </div>
            <div class="input-field">
                <label>📁 Room Name</label>
                <input type="text" id="roomName" placeholder="room-name" value="meeting-room">
            </div>
            <button id="joinBtn">🚀 Join Meeting</button>
        </div>
        <p style="font-size: 0.7rem; margin-top: 16px; text-align: center; color:#6b7280">
            ⚠️ For development only. In production, generate tokens on your backend server.
        </p>
    </div>

    <!-- Meeting Area -->
    <div id="meetingArea" class="meeting-area">
        <div id="videoGrid" class="video-grid"></div>
        <div class="controls">
            <div id="toggleMic" class="control-btn active" title="Microphone">🎤</div>
            <div id="toggleCam" class="control-btn active" title="Camera">📹</div>
            <div id="toggleScreen" class="control-btn" title="Share Screen">🖥️</div>
            <div id="leaveBtn" class="control-btn leave" title="Leave">🚪</div>
        </div>
        <div id="connectionStatus" class="status">🔌 Not connected</div>
    </div>
</div>

<script>
    // Global variables
    let room = null;
    let localVideoTrack = null;
    let localAudioTrack = null;
    let screenTrack = null;

    // DOM elements
    const setupPanel = document.getElementById('setupPanel');
    const meetingArea = document.getElementById('meetingArea');
    const videoGrid = document.getElementById('videoGrid');
    const connectionStatus = document.getElementById('connectionStatus');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');
    const toggleScreenBtn = document.getElementById('toggleScreen');

    // Helper: Generate LiveKit JWT token
    function generateToken(apiKey, apiSecret, roomName, participantName) {
        const now = Math.floor(Date.now() / 1000);
        const exp = now + 6 * 60 * 60; // 6 hours
        
        const payload = {
            "iss": apiKey,
            "exp": exp,
            "nbf": now,
            "sub": participantName,
            "video": {
                "room": roomName,
                "roomJoin": true,
                "canPublish": true,
                "canSubscribe": true
            }
        };
        
        const header = { alg: "HS256", typ: "JWT" };
        const token = KJUR.jws.JWS.sign("HS256", JSON.stringify(header), JSON.stringify(payload), apiSecret);
        return token;
    }

    // Add video element to grid
    function addVideoElement(track, participantName, isLocal = false) {
        const mediaStream = new MediaStream([track]);
        const containerId = `participant-${participantName.replace(/\s/g, '_')}-${Date.now()}`;
        const container = document.createElement('div');
        container.className = 'participant';
        container.id = containerId;
        
        const video = document.createElement('video');
        video.srcObject = mediaStream;
        video.autoplay = true;
        video.playsInline = true;
        
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `${participantName} ${isLocal ? '(You)' : ''}`;
        
        container.appendChild(video);
        container.appendChild(label);
        videoGrid.appendChild(container);
        
        return container;
    }

    // Remove participant video
    function removeParticipantVideo(participantName) {
        const elements = document.querySelectorAll(`[id^="participant-${participantName.replace(/\s/g, '_')}"]`);
        elements.forEach(el => el.remove());
    }

    // Handle incoming tracks
    function handleTrackSubscribed(track, publication, participant) {
        if (track.kind === 'video' && track.mediaStreamTrack) {
            const existingId = `participant-${participant.identity.replace(/\s/g, '_')}`;
            if (!document.getElementById(existingId)) {
                addVideoElement(track.mediaStreamTrack, participant.identity);
            }
        }
    }

    // Handle participant connection
    function handleParticipantConnected(participant) {
        connectionStatus.innerText = `👋 ${participant.identity} joined the room`;
    }

    // Handle participant disconnection
    function handleParticipantDisconnected(participant) {
        removeParticipantVideo(participant.identity);
        connectionStatus.innerText = `👋 ${participant.identity} left the room`;
    }

    // Leave/Cleanup function
    async function leaveMeeting() {
        if (room) {
            room.disconnect();
            room = null;
        }
        
        if (localVideoTrack) {
            localVideoTrack.stop();
            localVideoTrack = null;
        }
        
        if (localAudioTrack) {
            localAudioTrack.stop();
            localAudioTrack = null;
        }
        
        if (screenTrack) {
            screenTrack.stop();
            screenTrack = null;
        }
        
        // Clear video grid
        videoGrid.innerHTML = '';
        
        // Show setup panel
        setupPanel.classList.remove('hidden');
        meetingArea.classList.remove('active');
        connectionStatus.innerText = '🔌 Disconnected';
    }

    // Main join function
    async function joinMeeting() {
        // Get input values
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiSecret = document.getElementById('apiSecret').value.trim();
        const wsUrl = document.getElementById('wsUrl').value.trim();
        const userName = document.getElementById('userName').value.trim() || `User_${Math.floor(Math.random() * 1000)}`;
        const roomName = document.getElementById('roomName').value.trim() || 'meeting-room';
        
        // Validation
        if (!apiKey || !apiSecret || !wsUrl) {
            alert('Please fill in all fields: API Key, API Secret, and WebSocket URL');
            return;
        }
        
        if (!wsUrl.startsWith('wss://')) {
            alert('WebSocket URL must start with wss://');
            return;
        }
        
        // Check if KJUR is available
        if (typeof KJUR === 'undefined') {
            alert('JWT library still loading. Please wait a moment and try again.');
            return;
        }
        
        // Check if LiveKit client is available
        if (typeof LivekitClient === 'undefined') {
            alert('LiveKit client library still loading. Please wait and try again.');
            return;
        }
        
        try {
            connectionStatus.innerText = '🔄 Connecting to LiveKit...';
            
            // Generate token
            const token = generateToken(apiKey, apiSecret, roomName, userName);
            
            // Create room instance
            room = new LivekitClient.Room();
            
            // Set up event listeners
            room.on(LivekitClient.RoomEvent.ParticipantConnected, handleParticipantConnected);
            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
            room.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
            room.on(LivekitClient.RoomEvent.Disconnected, () => {
                connectionStatus.innerText = '❌ Disconnected from room';
                leaveMeeting();
            });
            
            // Connect to room
            await room.connect(wsUrl, token);
            connectionStatus.innerText = `✅ Connected to "${roomName}" as ${userName}`;
            
            // Hide setup, show meeting
            setupPanel.classList.add('hidden');
            meetingArea.classList.add('active');
            
            // Create and publish local tracks
            const localParticipant = room.localParticipant;
            
            // Get user media
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0];
            
            localVideoTrack = new LivekitClient.LocalVideoTrack(videoTrack);
            localAudioTrack = new LivekitClient.LocalAudioTrack(audioTrack);
            
            // Publish tracks
            await localParticipant.publishTrack(localVideoTrack);
            await localParticipant.publishTrack(localAudioTrack);
            
            // Add self video to grid
            addVideoElement(videoTrack, userName, true);
            
            // Update control button states
            toggleMicBtn.style.opacity = '1';
            toggleCamBtn.style.opacity = '1';
            toggleMicBtn.classList.add('active');
            toggleCamBtn.classList.add('active');
            
        } catch (error) {
            console.error('Connection error:', error);
            connectionStatus.innerText = `❌ Connection failed: ${error.message}`;
            alert(`Failed to join meeting:\n${error.message}\n\nCheck your credentials and WebSocket URL.`);
            await leaveMeeting();
        }
    }

    // Control button handlers
    toggleMicBtn.onclick = async () => {
        if (localAudioTrack) {
            const newState = !localAudioTrack.enabled;
            await localAudioTrack.setEnabled(newState);
            toggleMicBtn.style.opacity = newState ? '1' : '0.5';
            toggleMicBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
        }
    };
    
    toggleCamBtn.onclick = async () => {
        if (localVideoTrack) {
            const newState = !localVideoTrack.enabled;
            await localVideoTrack.setEnabled(newState);
            toggleCamBtn.style.opacity = newState ? '1' : '0.5';
            toggleCamBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
        }
    };
    
    toggleScreenBtn.onclick = async () => {
        if (!room) return;
        
        if (screenTrack) {
            // Stop screen share
            await room.localParticipant.unpublishTrack(screenTrack);
            screenTrack.stop();
            screenTrack = null;
            toggleScreenBtn.style.opacity = '0.5';
            toggleScreenBtn.style.background = '#2d2d44';
        } else {
            // Start screen share
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenVideoTrack = screenStream.getVideoTracks()[0];
                screenTrack = new LivekitClient.LocalVideoTrack(screenVideoTrack);
                await room.localParticipant.publishTrack(screenTrack);
                toggleScreenBtn.style.opacity = '1';
                toggleScreenBtn.style.background = '#4f46e5';
                
                // Stop when user ends screen share via browser UI
                screenVideoTrack.onended = () => {
                    if (screenTrack) {
                        room.localParticipant.unpublishTrack(screenTrack);
                        screenTrack.stop();
                        screenTrack = null;
                        toggleScreenBtn.style.opacity = '0.5';
                        toggleScreenBtn.style.background = '#2d2d44';
                    }
                };
            } catch (err) {
                console.error('Screen share error:', err);
                alert('Screen share cancelled or failed.');
            }
        }
    };
    
    leaveBtn.onclick = leaveMeeting;
    
    // Make sure join button has event listener
    joinBtn.addEventListener('click', joinMeeting);
    
    // Auto-focus on API key field
    document.getElementById('apiKey').focus();
</script>
</body>
</html>
