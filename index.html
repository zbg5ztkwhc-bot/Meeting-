<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MeetSpace - Video Meeting</title>
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.0/jsrsasign-all-min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card.hidden { display: none; }
        h1 { font-size: 32px; margin-bottom: 8px; color: #1a1a2e; text-align: center; }
        .subtitle { text-align: center; color: #666; margin-bottom: 32px; font-size: 14px; }
        .permission-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        .permission-box button {
            background: #0284c7;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
            width: auto;
            display: inline-block;
            padding: 10px 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .meeting-container {
            display: none;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
        }
        .meeting-container.active { display: block; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            min-height: 60vh;
            background: #0f0f1a;
        }
        .participant {
            background: #1e1e2e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
        }
        .participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .participant .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #16162a;
        }
        .ctrl-btn {
            background: #2d2d44;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            color: white;
        }
        .ctrl-btn.active { background: #4f46e5; }
        .ctrl-btn.leave { background: #dc2626; }
        .status { text-align: center; padding: 12px; font-size: 13px; color: #aaa; background: #0f0f1a; }
        .error-badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .ctrl-btn { width: 50px; height: 50px; font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="card" id="joinScreen">
    <h1>🎥 MeetSpace</h1>
    <div class="subtitle">Enter your name to join</div>
    
    <div class="permission-box" id="permissionBox">
        📷 Camera & Microphone Required
        <button id="requestPermBtn">Request Permission</button>
    </div>
    
    <input type="text" id="userName" placeholder="Your Name" value="Guest">
    <input type="text" id="roomName" placeholder="Room Name" value="main">
    <button id="joinBtn">Join Meeting</button>
    <div id="errorBox" class="error-badge" style="display: none;"></div>
</div>

<div class="meeting-container" id="meetingScreen">
    <div class="video-grid" id="videoGrid"></div>
    <div class="controls">
        <div class="ctrl-btn active" id="micBtn">🎤</div>
        <div class="ctrl-btn active" id="camBtn">📹</div>
        <div class="ctrl-btn leave" id="leaveBtn">🚪</div>
    </div>
    <div class="status" id="status">Ready</div>
</div>

<script>
    // ============================================
    // YOUR CREDENTIALS - Replace with your values
    // ============================================
    const WS_URL = 'wss://meeting-t8djz1pf.livekit.cloud';
    const API_KEY = 'API6VWLgTHiX4vR';
    const API_SECRET = 'wSxeUi1FLtzZ9VJSfhg181qP2klwVlAeb9pwwXTt';
    
    let room = null, localVideo = null, localAudio = null, stream = null;
    let hasPermission = false;
    
    function generateToken(roomName, identity) {
        const now = Math.floor(Date.now() / 1000);
        const exp = now + 6 * 3600;
        const payload = {
            "iss": API_KEY, "exp": exp, "nbf": now, "sub": identity,
            "video": { "room": roomName, "roomJoin": true, "canPublish": true, "canSubscribe": true }
        };
        const header = { alg: "HS256", typ: "JWT" };
        return KJUR.jws.JWS.sign("HS256", JSON.stringify(header), JSON.stringify(payload), API_SECRET);
    }
    
    async function requestPermissions() {
        const errorBox = document.getElementById('errorBox');
        const permissionBox = document.getElementById('permissionBox');
        
        try {
            // Test both camera and microphone
            const testStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            testStream.getTracks().forEach(track => track.stop());
            hasPermission = true;
            permissionBox.style.background = '#d4edda';
            permissionBox.style.border = '1px solid #28a745';
            permissionBox.innerHTML = '✅ Camera & Microphone Access Granted!<br><small>You can now join meetings</small>';
            errorBox.style.display = 'none';
            return true;
        } catch (err) {
            console.error('Permission error:', err);
            let errorMsg = '';
            if (err.name === 'NotAllowedError') {
                errorMsg = '❌ You denied camera/microphone access.\n\nPlease:\n1. Tap the camera/mic icon in the address bar\n2. Select "Allow"\n3. Refresh the page and click "Request Permission" again';
            } else if (err.name === 'NotFoundError') {
                errorMsg = '❌ No camera or microphone found on this device.';
            } else {
                errorMsg = `❌ Error: ${err.message}`;
            }
            errorBox.innerText = errorMsg;
            errorBox.style.display = 'block';
            hasPermission = false;
            return false;
        }
    }
    
    function addVideo(track, name, isSelf = false) {
        const container = document.createElement('div');
        container.className = 'participant';
        const video = document.createElement('video');
        video.srcObject = new MediaStream([track]);
        video.autoplay = true;
        video.playsInline = true;
        if (isSelf) video.muted = true;
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `${name} ${isSelf ? '(You)' : ''}`;
        container.appendChild(video);
        container.appendChild(label);
        document.getElementById('videoGrid').appendChild(container);
    }
    
    async function join() {
        const errorBox = document.getElementById('errorBox');
        errorBox.style.display = 'none';
        
        // Check if we're on HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
            errorBox.innerText = '⚠️ HTTPS required! Please deploy this page to a server with HTTPS (like Vercel or Netlify).';
            errorBox.style.display = 'block';
            return;
        }
        
        // Check permissions first
        if (!hasPermission) {
            const granted = await requestPermissions();
            if (!granted) return;
        }
        
        const userName = document.getElementById('userName').value.trim() || 'Guest';
        const roomName = document.getElementById('roomName').value.trim() || 'main';
        const status = document.getElementById('status');
        
        if (!userName) {
            errorBox.innerText = 'Please enter your name';
            errorBox.style.display = 'block';
            return;
        }
        
        status.innerText = '🎤 Requesting camera & microphone...';
        
        try {
            // Request media again (or reuse)
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0];
            
            status.innerText = '🔌 Connecting to LiveKit...';
            
            const token = generateToken(roomName, userName);
            room = new LivekitClient.Room();
            await room.connect(WS_URL, token);
            
            // Switch UI
            document.getElementById('joinScreen').classList.add('hidden');
            document.getElementById('meetingScreen').classList.add('active');
            
            // Publish tracks
            localVideo = new LivekitClient.LocalVideoTrack(videoTrack);
            localAudio = new LivekitClient.LocalAudioTrack(audioTrack);
            await room.localParticipant.publishTrack(localVideo);
            await room.localParticipant.publishTrack(localAudio);
            addVideo(videoTrack, userName, true);
            
            status.innerText = `✅ Connected to "${roomName}" as ${userName}`;
            
            // Handle remote participants
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
                if (track.kind === 'video' && track.mediaStreamTrack) {
                    addVideo(track.mediaStreamTrack, participant.identity);
                }
            });
            
            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (p) => {
                const tiles = document.querySelectorAll('.participant');
                tiles.forEach(tile => {
                    const label = tile.querySelector('.label');
                    if (label && label.innerText.includes(p.identity)) {
                        tile.remove();
                    }
                });
            });
            
        } catch (err) {
            console.error('Join error:', err);
            status.innerText = `❌ Error: ${err.message}`;
            errorBox.innerText = `Failed to join: ${err.message}\n\nMake sure:\n1. You allowed camera/microphone\n2. You're on HTTPS\n3. Your LiveKit credentials are correct`;
            errorBox.style.display = 'block';
            
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        }
    }
    
    async function leave() {
        if (room) room.disconnect();
        if (localVideo) localVideo.stop();
        if (localAudio) localAudio.stop();
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('videoGrid').innerHTML = '';
        document.getElementById('joinScreen').classList.remove('hidden');
        document.getElementById('meetingScreen').classList.remove('active');
        room = null;
    }
    
    async function toggleMic() {
        if (localAudio) {
            const enabled = !localAudio.enabled;
            await localAudio.setEnabled(enabled);
            const micBtn = document.getElementById('micBtn');
            micBtn.style.background = enabled ? '#4f46e5' : '#2d2d44';
            micBtn.style.opacity = enabled ? '1' : '0.5';
        }
    }
    
    async function toggleCam() {
        if (localVideo) {
            const enabled = !localVideo.enabled;
            await localVideo.setEnabled(enabled);
            const camBtn = document.getElementById('camBtn');
            camBtn.style.background = enabled ? '#4f46e5' : '#2d2d44';
            camBtn.style.opacity = enabled ? '1' : '0.5';
        }
    }
    
    // Event listeners
    document.getElementById('joinBtn').onclick = join;
    document.getElementById('leaveBtn').onclick = leave;
    document.getElementById('micBtn').onclick = toggleMic;
    document.getElementById('camBtn').onclick = toggleCam;
    document.getElementById('requestPermBtn').onclick = requestPermissions;
    
    // Check HTTPS on load
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
        document.getElementById('errorBox').innerText = '⚠️ This page must be served over HTTPS to access camera/microphone.\n\nDeploy to Vercel or Netlify for free!';
        document.getElementById('errorBox').style.display = 'block';
    }
    
    // Auto-request permissions on load
    setTimeout(() => {
        requestPermissions();
    }, 500);
</script>
</body>
</html>
