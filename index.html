<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LiveKit Meeting - Direct Connection</title>
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.0/jsrsasign-all-min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 32px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 32px;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #aaa;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: #0a0a12;
            border: 1px solid #2c2c40;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
        }

        button:hover {
            background: #6366f1;
        }

        .status {
            text-align: center;
            padding: 12px;
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 16px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .participant {
            background: #1e1e2e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        .participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .control-btn {
            background: #2d2d44;
            width: 56px;
            height: 56px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .control-btn.active {
            background: #4f46e5;
        }

        .control-btn.leave {
            background: #dc2626;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎥 LiveKit Meeting</h1>
    <div class="subtitle">Direct connection - No region fetch</div>
    
    <div id="setupPanel">
        <div class="form-group">
            <label>👤 Your Name</label>
            <input type="text" id="userName" placeholder="Enter your name" value="iPhoneUser">
        </div>
        <button id="joinBtn">🚀 Join Meeting</button>
        <div id="status" class="status">🔌 Ready to connect</div>
    </div>

    <div id="meetingArea" class="hidden">
        <div id="videoGrid" class="video-grid"></div>
        <div class="controls">
            <div id="toggleMic" class="control-btn active">🎤</div>
            <div id="toggleCam" class="control-btn active">📹</div>
            <div id="leaveBtn" class="control-btn leave">🚪</div>
        </div>
    </div>
</div>

<script>
    // YOUR CREDENTIALS
    const WS_URL = 'wss://meeting-t8djzlpf.livekit.cloud';
    const API_KEY = 'API6VWLgTHiX4vR';
    const API_SECRET = 'wSxeUi1FLtzZ9VJSfhg181qP2klwVlAeb9pwwXTt';
    
    let room = null;
    let localVideoTrack = null;
    let localAudioTrack = null;
    
    const setupPanel = document.getElementById('setupPanel');
    const meetingArea = document.getElementById('meetingArea');
    const videoGrid = document.getElementById('videoGrid');
    const statusDiv = document.getElementById('status');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');

    function generateToken(roomName, participantName) {
        const now = Math.floor(Date.now() / 1000);
        const exp = now + 6 * 60 * 60;
        
        const payload = {
            "iss": API_KEY,
            "exp": exp,
            "nbf": now,
            "sub": participantName,
            "video": {
                "room": roomName,
                "roomJoin": true,
                "canPublish": true,
                "canSubscribe": true
            }
        };
        
        const header = { alg: "HS256", typ: "JWT" };
        return KJUR.jws.JWS.sign("HS256", JSON.stringify(header), JSON.stringify(payload), API_SECRET);
    }

    function addVideoElement(track, participantName, isLocal = false) {
        const mediaStream = new MediaStream([track]);
        const container = document.createElement('div');
        container.className = 'participant';
        
        const video = document.createElement('video');
        video.srcObject = mediaStream;
        video.autoplay = true;
        video.playsInline = true;
        
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `${participantName} ${isLocal ? '(You)' : ''}`;
        
        container.appendChild(video);
        container.appendChild(label);
        videoGrid.appendChild(container);
        
        return container;
    }

    function clearVideoGrid() {
        videoGrid.innerHTML = '';
    }

    async function joinMeeting() {
        const userName = document.getElementById('userName').value.trim() || 'iPhoneUser';
        const roomName = 'meeting-room';
        
        statusDiv.innerText = '🎤 Requesting camera/microphone...';
        
        try {
            // Request permissions first
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: true, 
                audio: true 
            });
            
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0];
            
            statusDiv.innerText = '✅ Permission granted. Connecting to LiveKit...';
            
            const token = generateToken(roomName, userName);
            
            room = new LivekitClient.Room();
            
            // Direct connection - no region fetch
            await room.connect(WS_URL, token);
            
            statusDiv.innerText = `✅ Connected to "${roomName}" as ${userName}`;
            
            // Switch UI
            setupPanel.classList.add('hidden');
            meetingArea.classList.remove('hidden');
            
            // Publish local tracks
            const localParticipant = room.localParticipant;
            localVideoTrack = new LivekitClient.LocalVideoTrack(videoTrack);
            localAudioTrack = new LivekitClient.LocalAudioTrack(audioTrack);
            
            await localParticipant.publishTrack(localVideoTrack);
            await localParticipant.publishTrack(localAudioTrack);
            
            addVideoElement(videoTrack, userName, true);
            
            // Listen for other participants
            room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                statusDiv.innerText = `👋 ${participant.identity} joined`;
            });
            
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === 'video' && track.mediaStreamTrack) {
                    addVideoElement(track.mediaStreamTrack, participant.identity);
                }
            });
            
            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                statusDiv.innerText = `👋 ${participant.identity} left`;
                clearVideoGrid();
                // Re-add self video
                if (localVideoTrack) {
                    addVideoElement(localVideoTrack.mediaStreamTrack, userName, true);
                }
            });
            
        } catch (error) {
            console.error('Error:', error);
            statusDiv.innerText = `❌ Error: ${error.message}`;
            
            if (error.name === 'NotAllowedError') {
                alert('Please allow camera and microphone access in your browser settings.');
            } else if (error.message.includes('fetch')) {
                alert('Network error. Please check your internet connection and try again.\n\nIf on iPhone, try using Safari browser instead.');
            } else {
                alert(`Failed to join: ${error.message}`);
            }
        }
    }

    async function leaveMeeting() {
        if (room) {
            room.disconnect();
            room = null;
        }
        
        if (localVideoTrack) {
            localVideoTrack.stop();
            localVideoTrack = null;
        }
        
        if (localAudioTrack) {
            localAudioTrack.stop();
            localAudioTrack = null;
        }
        
        clearVideoGrid();
        setupPanel.classList.remove('hidden');
        meetingArea.classList.add('hidden');
        statusDiv.innerText = '🔌 Disconnected';
    }

    // Toggle microphone
    toggleMicBtn.onclick = async () => {
        if (localAudioTrack) {
            const newState = !localAudioTrack.enabled;
            await localAudioTrack.setEnabled(newState);
            toggleMicBtn.style.opacity = newState ? '1' : '0.5';
            toggleMicBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
        }
    };
    
    toggleCamBtn.onclick = async () => {
        if (localVideoTrack) {
            const newState = !localVideoTrack.enabled;
            await localVideoTrack.setEnabled(newState);
            toggleCamBtn.style.opacity = newState ? '1' : '0.5';
            toggleCamBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
        }
    };
    
    leaveBtn.onclick = leaveMeeting;
    joinBtn.onclick = joinMeeting;
</script>
</body>
</html>
