<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeetSpace - LiveKit Video Meeting</title>
    <script src="https://unpkg.com/livekit-client@2.0.0/dist/livekit-client.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.8.0/jsrsasign-all-min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Setup Panel */
        .setup-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 50px auto;
        }

        .setup-panel.hidden {
            display: none;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1a1a2e;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        /* Meeting Area */
        .meeting-area {
            display: none;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
        }

        .meeting-area.active {
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            min-height: 70vh;
            background: #0f0f1a;
        }

        .participant {
            background: #1e1e2e;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            border: 2px solid #333;
        }

        .participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #16162a;
        }

        .control-btn {
            background: #2d2d44;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .control-btn.active {
            background: #4f46e5;
        }

        .control-btn.leave {
            background: #dc2626;
        }

        .status {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            color: #aaa;
            background: #0f0f1a;
        }

        .info-badge {
            background: #e8f0fe;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            border-left: 4px solid #667eea;
            color: #333;
        }

        @media (max-width: 700px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Setup Panel -->
    <div id="setupPanel" class="setup-panel">
        <h1>🎥 MeetSpace</h1>
        <div class="subtitle">Real-time video meetings powered by LiveKit</div>
        
        <div class="info-badge">
            ✅ Ready to use! Enter your name and join instantly.
        </div>
        
        <div class="form-group">
            <label>👤 Your Name</label>
            <input type="text" id="userName" placeholder="Enter your name" value="User">
        </div>
        
        <div class="form-group">
            <label>📁 Room Name</label>
            <input type="text" id="roomName" placeholder="room-name" value="main-room">
        </div>
        
        <button id="joinBtn">🚀 Join Meeting</button>
        <p style="font-size: 12px; text-align: center; margin-top: 20px; color: #999;">
            🔒 Secure WebRTC connection
        </p>
    </div>

    <!-- Meeting Area -->
    <div id="meetingArea" class="meeting-area">
        <div id="videoGrid" class="video-grid"></div>
        <div class="controls">
            <div id="toggleMic" class="control-btn active" title="Microphone">🎤</div>
            <div id="toggleCam" class="control-btn active" title="Camera">📹</div>
            <div id="toggleScreen" class="control-btn" title="Share Screen">🖥️</div>
            <div id="leaveBtn" class="control-btn leave" title="Leave">🚪</div>
        </div>
        <div id="status" class="status">🔌 Ready to connect</div>
    </div>
</div>

<script>
    // YOUR LIVEKIT CREDENTIALS (pre-configured)
    const LIVEKIT_CONFIG = {
        wsUrl: 'wss://meeting-t8djzlpf.livekit.cloud',
        apiKey: 'API6VWLgTHiX4vR',
        apiSecret: 'wSxeUi1FLtzZ9VJSfhg181qP2klwVlAeb9pwwXTt'
    };
    
    let room = null;
    let localVideoTrack = null;
    let localAudioTrack = null;
    let screenTrack = null;
    
    const setupPanel = document.getElementById('setupPanel');
    const meetingArea = document.getElementById('meetingArea');
    const videoGrid = document.getElementById('videoGrid');
    const statusDiv = document.getElementById('status');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const toggleMicBtn = document.getElementById('toggleMic');
    const toggleCamBtn = document.getElementById('toggleCam');
    const toggleScreenBtn = document.getElementById('toggleScreen');

    function generateToken(roomName, participantName) {
        const now = Math.floor(Date.now() / 1000);
        const exp = now + 6 * 60 * 60;
        
        const payload = {
            "iss": LIVEKIT_CONFIG.apiKey,
            "exp": exp,
            "nbf": now,
            "sub": participantName,
            "video": {
                "room": roomName,
                "roomJoin": true,
                "canPublish": true,
                "canSubscribe": true
            }
        };
        
        const header = { alg: "HS256", typ: "JWT" };
        return KJUR.jws.JWS.sign("HS256", JSON.stringify(header), JSON.stringify(payload), LIVEKIT_CONFIG.apiSecret);
    }

    function addVideoElement(track, participantName, isLocal = false) {
        const container = document.createElement('div');
        container.className = 'participant';
        
        const video = document.createElement('video');
        video.srcObject = new MediaStream([track]);
        video.autoplay = true;
        video.playsInline = true;
        
        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = `${participantName} ${isLocal ? '(You)' : ''}`;
        
        container.appendChild(video);
        container.appendChild(label);
        videoGrid.appendChild(container);
        
        return container;
    }

    function clearVideoGrid() {
        videoGrid.innerHTML = '';
    }

    async function joinMeeting() {
        const userName = document.getElementById('userName').value.trim() || 'User';
        const roomName = document.getElementById('roomName').value.trim() || 'main-room';
        
        statusDiv.innerText = '🎤 Requesting camera and microphone...';
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: true, 
                audio: true 
            });
            
            const videoTrack = stream.getVideoTracks()[0];
            const audioTrack = stream.getAudioTracks()[0];
            
            statusDiv.innerText = '✅ Connected. Joining room...';
            
            const token = generateToken(roomName, userName);
            
            room = new LivekitClient.Room();
            
            await room.connect(LIVEKIT_CONFIG.wsUrl, token);
            
            statusDiv.innerText = `✅ In room "${roomName}" as ${userName}`;
            
            setupPanel.classList.add('hidden');
            meetingArea.classList.add('active');
            
            const localParticipant = room.localParticipant;
            localVideoTrack = new LivekitClient.LocalVideoTrack(videoTrack);
            localAudioTrack = new LivekitClient.LocalAudioTrack(audioTrack);
            
            await localParticipant.publishTrack(localVideoTrack);
            await localParticipant.publishTrack(localAudioTrack);
            
            addVideoElement(videoTrack, userName, true);
            
            // Handle other participants
            room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
                statusDiv.innerText = `👋 ${participant.identity} joined`;
                setTimeout(() => {
                    statusDiv.innerText = `✅ In room "${roomName}" - ${videoGrid.children.length} participants`;
                }, 2000);
            });
            
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === 'video' && track.mediaStreamTrack) {
                    addVideoElement(track.mediaStreamTrack, participant.identity);
                }
            });
            
            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                statusDiv.innerText = `👋 ${participant.identity} left`;
                clearVideoGrid();
                if (localVideoTrack) {
                    addVideoElement(localVideoTrack.mediaStreamTrack, userName, true);
                }
            });
            
        } catch (error) {
            console.error(error);
            statusDiv.innerText = `❌ Error: ${error.message}`;
            
            if (error.name === 'NotAllowedError') {
                alert('Please allow camera and microphone access in your browser.');
            } else {
                alert(`Failed to join: ${error.message}\n\nMake sure you have a stable internet connection.`);
            }
        }
    }

    async function leaveMeeting() {
        if (room) {
            room.disconnect();
            room = null;
        }
        
        if (localVideoTrack) {
            localVideoTrack.stop();
            localVideoTrack = null;
        }
        
        if (localAudioTrack) {
            localAudioTrack.stop();
            localAudioTrack = null;
        }
        
        if (screenTrack) {
            screenTrack.stop();
            screenTrack = null;
        }
        
        clearVideoGrid();
        setupPanel.classList.remove('hidden');
        meetingArea.classList.remove('active');
        statusDiv.innerText = '🔌 Disconnected';
    }

    toggleMicBtn.onclick = async () => {
        if (localAudioTrack) {
            const newState = !localAudioTrack.enabled;
            await localAudioTrack.setEnabled(newState);
            toggleMicBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
            toggleMicBtn.style.opacity = newState ? '1' : '0.5';
        }
    };
    
    toggleCamBtn.onclick = async () => {
        if (localVideoTrack) {
            const newState = !localVideoTrack.enabled;
            await localVideoTrack.setEnabled(newState);
            toggleCamBtn.style.background = newState ? '#4f46e5' : '#2d2d44';
            toggleCamBtn.style.opacity = newState ? '1' : '0.5';
        }
    };
    
    toggleScreenBtn.onclick = async () => {
        if (!room) return;
        
        if (screenTrack) {
            await room.localParticipant.unpublishTrack(screenTrack);
            screenTrack.stop();
            screenTrack = null;
            toggleScreenBtn.style.background = '#2d2d44';
            toggleScreenBtn.style.opacity = '0.5';
        } else {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenVideoTrack = screenStream.getVideoTracks()[0];
                screenTrack = new LivekitClient.LocalVideoTrack(screenVideoTrack);
                await room.localParticipant.publishTrack(screenTrack);
                toggleScreenBtn.style.background = '#4f46e5';
                toggleScreenBtn.style.opacity = '1';
                
                screenVideoTrack.onended = () => {
                    if (screenTrack) {
                        room.localParticipant.unpublishTrack(screenTrack);
                        screenTrack.stop();
                        screenTrack = null;
                        toggleScreenBtn.style.background = '#2d2d44';
                        toggleScreenBtn.style.opacity = '0.5';
                    }
                };
            } catch (err) {
                console.error('Screen share error:', err);
            }
        }
    };
    
    leaveBtn.onclick = leaveMeeting;
    joinBtn.onclick = joinMeeting;
</script>
</body>
</html>
