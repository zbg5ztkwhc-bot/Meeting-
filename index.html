<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeshMeet - 20+ Peer Video Conference + Recording + Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0.75rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .room-controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
        }

        .copy-btn, .share-btn, .leave-btn {
            background: #334155;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            color: white;
        }

        .share-btn {
            background: #10b981;
        }

        .share-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .leave-btn {
            background: #dc2626;
        }

        .copy-btn:hover { background: #475569; }
        .leave-btn:hover { background: #b91c1c; }

        .video-grid-container {
            flex: 1;
            overflow-y: auto;
            margin: 0.75rem 0;
            min-height: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
            padding: 0.25rem;
        }

        .video-card {
            background: #020617;
            border-radius: 0.8rem;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
            transition: all 0.2s;
            aspect-ratio: 16 / 9;
        }

        .video-card:hover {
            border-color: #6366f1;
            transform: scale(1.01);
            z-index: 10;
        }

        .video-label {
            background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent);
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .local-video video {
            transform: scaleX(-1);
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }

        button {
            background: #2d3a5e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: #4f46e5; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: #0f172a; }

        .recording-badge {
            background: #1e1b4b;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(1.3);}
            100% { opacity: 1; transform: scale(1);}
        }

        .sidebar-info {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            z-index: 100;
            pointer-events: none;
        }

        .recordings-panel {
            position: fixed;
            top: 5rem;
            right: 1rem;
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 0.8rem;
            border: 1px solid #334155;
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.3s;
            pointer-events: auto;
        }

        .recordings-panel.open {
            transform: translateX(0);
        }

        .recordings-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .recordings-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .recording-item {
            background: #1e293b;
            margin: 0.3rem 0;
            padding: 0.4rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download-link {
            background: #3b4252;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            cursor: pointer;
            font-size: 0.65rem;
        }

        .toggle-panel {
            position: fixed;
            bottom: 5rem;
            right: 1rem;
            background: #4f46e5;
            border-radius: 3rem;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 200;
        }

        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .share-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .share-modal-content {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid #6366f1;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }

        .share-modal-content h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .share-link-container {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .share-link-container input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.6rem;
            border-radius: 0.8rem;
            color: white;
            font-size: 0.8rem;
        }

        .share-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .share-buttons button {
            flex: 1;
            justify-content: center;
        }

        .close-modal {
            background: #334155;
            margin-top: 1rem;
            width: 100%;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
            button {
                padding: 0.4rem 0.8rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">
            <h1>🎥 MeshMeet</h1>
            <p style="font-size: 0.65rem;">20+ peer mesh conference • No server required • Record & Share</p>
        </div>
        <div class="room-controls">
            <span>🔑 Room: <strong id="roomIdDisplay">---</strong></span>
            <button class="copy-btn" id="copyRoomBtn">📋 Copy link</button>
            <button class="share-btn" id="shareRoomBtn">📤 Share</button>
            <button class="leave-btn" id="leaveRoomBtn">🚪 Leave</button>
        </div>
    </div>

    <div class="video-grid-container" id="videoGridContainer">
        <div id="videoGrid" class="video-grid"></div>
    </div>

    <div class="controls-bar">
        <button id="joinRoomBtn" class="btn-primary">🎙️ Create / Join Room</button>
        <button id="toggleMediaBtn" class="btn-primary">🎥 Start Camera</button>
        <button id="stopMediaBtn" class="btn-warning" disabled>⏹️ Stop</button>
        <button id="toggleMicBtn" disabled>🎤 Mute</button>
        <button id="startRecordingBtn" class="btn-success" disabled>🔴 Record Meeting</button>
        <button id="stopRecordingBtn" class="btn-danger" disabled>⏹️ Stop Recording</button>
        <div id="recordIndicator" style="display: none;" class="recording-badge">
            <span class="red-dot"></span> <span>REC</span>
        </div>
    </div>

    <div class="sidebar-info" id="participantInfo">
        👥 0 participants
    </div>
    <div class="toggle-panel" id="toggleRecordingsBtn">
        📼 Recordings
    </div>
    <div class="recordings-panel" id="recordingsPanel">
        <div class="recordings-header">
            <strong>💾 Saved Recordings</strong>
            <span style="cursor:pointer;" id="closePanelBtn">✖️</span>
        </div>
        <div id="recordingsList" class="recordings-list">
            <div style="color: #6b7280; text-align: center;">No recordings yet</div>
        </div>
    </div>

    <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
            <h3>📢 Invite to Meeting</h3>
            <p style="margin-bottom: 0.5rem;">Share this link with up to 20+ participants:</p>
            <div class="share-link-container">
                <input type="text" id="shareLinkInput" readonly>
                <button id="copyShareLinkBtn" style="padding: 0.6rem 1rem;">Copy</button>
            </div>
            <div class="share-buttons">
                <button id="shareWhatsAppBtn">💬 WhatsApp</button>
                <button id="shareTelegramBtn">✈️ Telegram</button>
                <button id="shareEmailBtn">📧 Email</button>
                <button id="shareTwitterBtn">🐦 X</button>
            </div>
            <button class="close-modal" id="closeModalBtn">Close</button>
        </div>
    </div>
    <div id="toast" class="toast"></div>
</div>

<script>
    // WebRTC Mesh Network with Signaling Server
    // Using a free public signaling server (Scaledrone compatible)
    // Alternative: Use PeerJS cloud or simple WebSocket
    
    // We'll use a reliable free signaling service: PeerJS cloud
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
    script.onload = initPeerJS;
    document.head.appendChild(script);
    
    let peer = null;
    let connections = new Map(); // peerId -> MediaConnection
    let localStream = null;
    let currentRoom = null;
    let isInRoom = false;
    let isCameraActive = false;
    let isMicMuted = false;
    let myPeerId = null;
    
    // Recording
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let savedRecordings = [];
    
    // DOM elements
    const videoGrid = document.getElementById('videoGrid');
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const shareRoomBtn = document.getElementById('shareRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const toggleMediaBtn = document.getElementById('toggleMediaBtn');
    const stopMediaBtn = document.getElementById('stopMediaBtn');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const startRecordingBtn = document.getElementById('startRecordingBtn');
    const stopRecordingBtn = document.getElementById('stopRecordingBtn');
    const recordIndicator = document.getElementById('recordIndicator');
    const participantInfoSpan = document.getElementById('participantInfo');
    const recordingsPanel = document.getElementById('recordingsPanel');
    const toggleRecordingsBtn = document.getElementById('toggleRecordingsBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const recordingsListDiv = document.getElementById('recordingsList');
    const shareModal = document.getElementById('shareModal');
    const shareLinkInput = document.getElementById('shareLinkInput');
    const copyShareLinkBtn = document.getElementById('copyShareLinkBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const toast = document.getElementById('toast');
    
    let currentRoomName = null;
    let roomPeers = new Set();
    
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function initRoom() {
        const urlParams = new URLSearchParams(window.location.search);
        let roomName = urlParams.get('room');
        if (!roomName) {
            roomName = 'room_' + Math.random().toString(36).substring(2, 12);
            window.history.pushState({}, '', `?room=${roomName}`);
        }
        currentRoomName = roomName;
        roomIdDisplay.textContent = currentRoomName;
        updateShareLink();
    }
    
    function getRoomLink() {
        return `${window.location.origin}${window.location.pathname}?room=${currentRoomName}`;
    }
    
    function updateShareLink() {
        if (shareLinkInput) shareLinkInput.value = getRoomLink();
    }
    
    copyRoomBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        showToast('✅ Link copied!');
    });
    
    shareRoomBtn.addEventListener('click', () => {
        updateShareLink();
        shareModal.classList.add('open');
    });
    
    function closeShareModal() { shareModal.classList.remove('open'); }
    
    copyShareLinkBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        showToast('✅ Copied!');
    });
    
    shareWhatsAppBtn.addEventListener('click', () => {
        window.open(`https://wa.me/?text=${encodeURIComponent(`Join my video meeting!\n${getRoomLink()}`)}`, '_blank');
        closeShareModal();
    });
    shareTelegramBtn.addEventListener('click', () => {
        window.open(`https://t.me/share/url?url=${encodeURIComponent(getRoomLink())}&text=Join%20my%20video%20meeting!`, '_blank');
        closeShareModal();
    });
    shareEmailBtn.addEventListener('click', () => {
        window.location.href = `mailto:?subject=Video%20Meeting&body=Join%20my%20meeting:%20${encodeURIComponent(getRoomLink())}`;
        closeShareModal();
    });
    shareTwitterBtn.addEventListener('click', () => {
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`Join my video meeting! ${getRoomLink()}`)}`, '_blank');
        closeShareModal();
    });
    closeModalBtn.addEventListener('click', closeShareModal);
    shareModal.addEventListener('click', (e) => { if (e.target === shareModal) closeShareModal(); });
    
    function initPeerJS() {
        initRoom();
        peer = new Peer(generatePeerId(), {
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });
        
        peer.on('open', (id) => {
            myPeerId = id;
            showToast('🎉 Ready to connect! Click "Create / Join Room"');
            console.log('My Peer ID:', id);
        });
        
        peer.on('call', (call) => {
            if (localStream && isInRoom) {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    addRemoteVideo(call.peer, remoteStream);
                });
                connections.set(call.peer, call);
                roomPeers.add(call.peer);
                updateParticipantCount();
            }
        });
        
        peer.on('error', (err) => {
            console.error('Peer error:', err);
            showToast('Connection error. Please refresh.');
        });
    }
    
    function generatePeerId() {
        return 'user_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
    }
    
    async function startLocalMedia() {
        try {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const localCard = document.getElementById('local-video-card');
            if (!localCard) {
                const card = document.createElement('div');
                card.className = 'video-card local-video';
                card.id = 'local-video-card';
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                const label = document.createElement('div');
                label.className = 'video-label';
                label.textContent = 'You';
                card.appendChild(video);
                card.appendChild(label);
                videoGrid.insertBefore(card, videoGrid.firstChild);
            }
            const videoEl = document.querySelector('#local-video-card video');
            if (videoEl) videoEl.srcObject = localStream;
            
            isCameraActive = true;
            toggleMediaBtn.textContent = '📷 Camera On';
            stopMediaBtn.disabled = false;
            toggleMicBtn.disabled = false;
            startRecordingBtn.disabled = false;
            
            return true;
        } catch (err) {
            console.error(err);
            showToast('Camera/Mic access denied');
            return false;
        }
    }
    
    function stopLocalMedia() {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        const localCard = document.getElementById('local-video-card');
        if (localCard) localCard.remove();
        isCameraActive = false;
        toggleMediaBtn.textContent = '🎥 Start Camera';
        stopMediaBtn.disabled = true;
        toggleMicBtn.disabled = true;
        startRecordingBtn.disabled = true;
        showToast('Camera stopped');
    }
    
    function toggleMute() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            toggleMicBtn.innerHTML = isMicMuted ? '🎤 Unmute' : '🎤 Mute';
            toggleMicBtn.style.background = isMicMuted ? '#dc2626' : '';
        }
    }
    
    async function joinRoom() {
        if (!peer || !peer.id) {
            showToast('Waiting for connection...');
            return;
        }
        if (isInRoom) {
            showToast('Already in a room');
            return;
        }
        
        await startLocalMedia();
        isInRoom = true;
        joinRoomBtn.disabled = true;
        showToast(`Joined room: ${currentRoomName}`);
        
        // Broadcast to all peers in the room using URL hash or localStorage for demo
        // For mesh, we'll use a simple broadcast via localStorage cross-tab?
        // Better: use a simple signaling via a public channel
        // Since we need cross-device signaling, we'll use a simple Firebase-less approach:
        // Use a free broadcast server: wss://broadcast-server.herokuapp.com - but unreliable
        // Alternative: PeerJS already handles signaling via PeerJS cloud. For room-based discovery,
        // we'll store peer IDs in localStorage with room key (for same-device testing) 
        // But for real cross-device: Users need to share Peer IDs. Simpler: use URL parameters.
        
        // For demo, provide manual peer ID sharing
        showToast(`Your ID: ${myPeerId}. Share this with others to connect!`);
        
        // Automatically connect to peers that join via URL param
        const urlParams = new URLSearchParams(window.location.search);
        const targetPeer = urlParams.get('peer');
        if (targetPeer && targetPeer !== myPeerId && !connections.has(targetPeer)) {
            await callPeer(targetPeer);
        }
    }
    
    async function callPeer(peerId) {
        if (!localStream) {
            showToast('Start camera first');
            return;
        }
        const call = peer.call(peerId, localStream);
        call.on('stream', (remoteStream) => {
            addRemoteVideo(peerId, remoteStream);
        });
        connections.set(peerId, call);
        roomPeers.add(peerId);
        updateParticipantCount();
        showToast(`Connected to ${peerId.substring(0, 8)}`);
    }
    
    function addRemoteVideo(peerId, stream) {
        let card = document.getElementById(`video-${peerId}`);
        if (!card) {
            card = document.createElement('div');
            card.className = 'video-card';
            card.id = `video-${peerId}`;
            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = `Peer ${peerId.substring(0, 8)}`;
            card.appendChild(video);
            card.appendChild(label);
            videoGrid.appendChild(card);
        }
        const videoEl = card.querySelector('video');
        videoEl.srcObject = stream;
    }
    
    function removeRemoteVideo(peerId) {
        const card = document.getElementById(`video-${peerId}`);
        if (card) card.remove();
        roomPeers.delete(peerId);
        connections.delete(peerId);
        updateParticipantCount();
    }
    
    function updateParticipantCount() {
        const count = roomPeers.size + (isCameraActive ? 1 : 0);
        participantInfoSpan.innerHTML = `👥 ${count} participants`;
    }
    
    function leaveRoom() {
        // Close all connections
        connections.forEach((call, peerId) => {
            call.close();
            removeRemoteVideo(peerId);
        });
        connections.clear();
        roomPeers.clear();
        stopLocalMedia();
        isInRoom = false;
        joinRoomBtn.disabled = false;
        updateParticipantCount();
        showToast('Left the room');
    }
    
    // Recording functions
    async function startClientRecording() {
        if (!localStream) {
            showToast('Start camera first');
            return;
        }
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const combinedTracks = [...displayStream.getVideoTracks(), ...localStream.getAudioTracks()];
            const combinedStream = new MediaStream(combinedTracks);
            
            mediaRecorder = new MediaRecorder(combinedStream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                savedRecordings.push({ name: `meeting_${timestamp}.webm`, url });
                updateRecordingsList();
                recordIndicator.style.display = 'none';
                startRecordingBtn.disabled = false;
                stopRecordingBtn.disabled = true;
                displayStream.getTracks().forEach(t => t.stop());
                showToast('Recording saved!');
            };
            mediaRecorder.start(1000);
            isRecording = true;
            recordIndicator.style.display = 'inline-flex';
            startRecordingBtn.disabled = true;
            stopRecordingBtn.disabled = false;
            showToast('Recording started');
        } catch (err) {
            showToast('Screen capture permission needed');
        }
    }
    
    function stopClientRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
        }
    }
    
    function updateRecordingsList() {
        if (savedRecordings.length === 0) {
            recordingsListDiv.innerHTML = '<div style="color: #6b7280; text-align: center;">No recordings yet</div>';
            return;
        }
        recordingsListDiv.innerHTML = '';
        savedRecordings.slice().reverse().forEach(rec => {
            const div = document.createElement('div');
            div.className = 'recording-item';
            div.innerHTML = `
                <span>📹 ${rec.name}</span>
                <span class="download-link" data-url="${rec.url}" data-name="${rec.name}">⬇️ DL</span>
            `;
            recordingsListDiv.appendChild(div);
        });
        document.querySelectorAll('.download-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const url = link.getAttribute('data-url');
                const name = link.getAttribute('data-name');
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.click();
            });
        });
    }
    
    // Add manual peer connection UI
    const manualConnectDiv = document.createElement('div');
    manualConnectDiv.style.position = 'fixed';
    manualConnectDiv.style.bottom = '5rem';
    manualConnectDiv.style.left = '1rem';
    manualConnectDiv.style.background = '#1e293b';
    manualConnectDiv.style.padding = '0.5rem 1rem';
    manualConnectDiv.style.borderRadius = '2rem';
    manualConnectDiv.style.fontSize = '0.7rem';
    manualConnectDiv.style.zIndex = '200';
    manualConnectDiv.innerHTML = `
        <input type="text" id="manualPeerId" placeholder="Enter Peer ID" style="background:#0f172a; border:1px solid #334155; padding:0.3rem; border-radius:1rem; color:white;">
        <button id="manualConnectBtn" style="background:#4f46e5; padding:0.3rem 0.8rem; margin-left:0.5rem;">Connect</button>
        <div style="font-size:0.6rem; margin-top:0.2rem;">Your ID: <span id="myPeerIdDisplay">---</span></div>
    `;
    document.body.appendChild(manualConnectDiv);
    
    function updateMyPeerIdDisplay() {
        const display = document.getElementById('myPeerIdDisplay');
        if (display && myPeerId) display.textContent = myPeerId.substring(0, 12);
    }
    
    setInterval(() => {
        if (myPeerId) updateMyPeerIdDisplay();
    }, 1000);
    
    document.addEventListener('click', (e) => {
        if (e.target.id === 'manualConnectBtn') {
            const input = document.getElementById('manualPeerId');
            if (input && input.value && peer) {
                callPeer(input.value);
                input.value = '';
            }
        }
    });
    
    // Event listeners
    joinRoomBtn.addEventListener('click', joinRoom);
    toggleMediaBtn.addEventListener('click', startLocalMedia);
    stopMediaBtn.addEventListener('click', stopLocalMedia);
    toggleMicBtn.addEventListener('click', toggleMute);
    startRecordingBtn.addEventListener('click', startClientRecording);
    stopRecordingBtn.addEventListener('click', stopClientRecording);
    leaveRoomBtn.addEventListener('click', leaveRoom);
    toggleRecordingsBtn.addEventListener('click', () => recordingsPanel.classList.toggle('open'));
    closePanelBtn.addEventListener('click', () => recordingsPanel.classList.remove('open'));
    
    // Auto-initialize
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPeerJS);
    } else {
        initPeerJS();
    }
</script>
</body>
</html>
