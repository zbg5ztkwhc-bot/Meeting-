<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CloudMeet - Free Server P2P Conference (20+ peers)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, 'Roboto', sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0.75rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            background: #1e293b;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-dot.connected { background: #10b981; }
        .status-dot.disconnected { background: #ef4444; }

        .room-controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
        }

        .copy-btn, .share-btn, .leave-btn {
            background: #334155;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            color: white;
        }

        .share-btn { background: #10b981; }
        .share-btn:hover { background: #059669; }
        .leave-btn { background: #dc2626; }
        .copy-btn:hover { background: #475569; }

        .video-grid-container {
            flex: 1;
            overflow-y: auto;
            margin: 0.75rem 0;
            min-height: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
            padding: 0.25rem;
        }

        .video-card {
            background: #020617;
            border-radius: 0.8rem;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
            transition: all 0.2s;
            aspect-ratio: 16 / 9;
        }

        .video-card:hover {
            border-color: #6366f1;
            transform: scale(1.01);
        }

        .video-label {
            background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent);
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .local-video video {
            transform: scaleX(-1);
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }

        button {
            background: #2d3a5e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: #4f46e5; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: #0f172a; }

        .recording-badge {
            background: #1e1b4b;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(1.3);}
            100% { opacity: 1; transform: scale(1);}
        }

        .sidebar-info {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            z-index: 100;
        }

        .recordings-panel {
            position: fixed;
            top: 5rem;
            right: 1rem;
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 0.8rem;
            border: 1px solid #334155;
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.3s;
        }

        .recordings-panel.open {
            transform: translateX(0);
        }

        .recordings-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .recording-item {
            background: #1e293b;
            margin: 0.3rem 0;
            padding: 0.4rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download-link {
            background: #3b4252;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            cursor: pointer;
        }

        .toggle-panel {
            position: fixed;
            bottom: 5rem;
            right: 1rem;
            background: #4f46e5;
            border-radius: 3rem;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 200;
        }

        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .share-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .share-modal-content {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid #6366f1;
        }

        .share-link-container {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .share-link-container input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.6rem;
            border-radius: 0.8rem;
            color: white;
        }

        .share-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }

        @media (max-width: 768px) {
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
            button { padding: 0.4rem 0.8rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">
            <h1>☁️ CloudMeet</h1>
            <p style="font-size: 0.65rem;">Free signaling server • 20+ P2P mesh • Record & Share</p>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="signalStatus"></span>
            <span id="signalStatusText">Connecting...</span>
        </div>
        <div class="room-controls">
            <span>🏠 Room: <strong id="roomIdDisplay">loading...</strong></span>
            <button class="copy-btn" id="copyRoomBtn">📋 Copy link</button>
            <button class="share-btn" id="shareRoomBtn">📤 Share</button>
            <button class="leave-btn" id="leaveRoomBtn">🚪 Leave Room</button>
        </div>
    </div>

    <div class="video-grid-container">
        <div id="videoGrid" class="video-grid"></div>
    </div>

    <div class="controls-bar">
        <button id="startCameraBtn" class="btn-primary">🎥 Start Camera</button>
        <button id="stopCameraBtn" class="btn-warning" disabled>⏹️ Stop</button>
        <button id="muteMicBtn" disabled>🎤 Mute</button>
        <button id="startRecordBtn" class="btn-success" disabled>🔴 Record Meeting</button>
        <button id="stopRecordBtn" class="btn-danger" disabled>⏹️ Stop Recording</button>
        <div id="recordIndicator" style="display: none;" class="recording-badge">
            <span class="red-dot"></span> <span>REC</span>
        </div>
    </div>

    <div class="sidebar-info" id="participantInfo">👥 0 participants</div>
    <div class="toggle-panel" id="toggleRecordingsBtn">📼 Recordings</div>
    
    <div class="recordings-panel" id="recordingsPanel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <strong>💾 Saved Recordings</strong>
            <span style="cursor:pointer;" id="closePanelBtn">✖️</span>
        </div>
        <div id="recordingsList" class="recordings-list">
            <div style="color: #6b7280; text-align: center;">No recordings yet</div>
        </div>
    </div>

    <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
            <h3>📢 Invite to Meeting</h3>
            <p style="margin-bottom: 0.5rem;">Share this link with up to 50+ participants:</p>
            <div class="share-link-container">
                <input type="text" id="shareLinkInput" readonly>
                <button id="copyShareLinkBtn">Copy</button>
            </div>
            <div class="share-buttons">
                <button id="shareWhatsAppBtn">💬 WhatsApp</button>
                <button id="shareTelegramBtn">✈️ Telegram</button>
                <button id="shareEmailBtn">📧 Email</button>
                <button id="shareTwitterBtn">🐦 X</button>
            </div>
            <button id="closeModalBtn" style="width:100%; margin-top:1rem;">Close</button>
        </div>
    </div>
    <div id="toast" class="toast"></div>
</div>

<script>
    // ============================================
    // FREE EXTERNAL SIGNALING SERVER IMPLEMENTATION
    // Using multiple free services with fallbacks
    // ============================================
    
    let peerConnections = new Map(); // peerId -> RTCPeerConnection
    let localStream = null;
    let socket = null;
    let currentRoomId = null;
    let myPeerId = null;
    let isInRoom = false;
    let isCameraActive = false;
    let isMicMuted = false;
    
    // Recording variables
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let savedRecordings = [];
    
    // DOM Elements
    const videoGrid = document.getElementById('videoGrid');
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const shareRoomBtn = document.getElementById('shareRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const muteMicBtn = document.getElementById('muteMicBtn');
    const startRecordBtn = document.getElementById('startRecordBtn');
    const stopRecordBtn = document.getElementById('stopRecordBtn');
    const recordIndicator = document.getElementById('recordIndicator');
    const participantInfoSpan = document.getElementById('participantInfo');
    const recordingsPanel = document.getElementById('recordingsPanel');
    const toggleRecordingsBtn = document.getElementById('toggleRecordingsBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const recordingsListDiv = document.getElementById('recordingsList');
    const shareModal = document.getElementById('shareModal');
    const shareLinkInput = document.getElementById('shareLinkInput');
    const copyShareLinkBtn = document.getElementById('copyShareLinkBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const shareWhatsAppBtn = document.getElementById('shareWhatsAppBtn');
    const shareTelegramBtn = document.getElementById('shareTelegramBtn');
    const shareEmailBtn = document.getElementById('shareEmailBtn');
    const shareTwitterBtn = document.getElementById('shareTwitterBtn');
    const toast = document.getElementById('toast');
    const signalStatusDot = document.getElementById('signalStatus');
    const signalStatusText = document.getElementById('signalStatusText');
    
    // ICE Servers for better connectivity
    const iceServers = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun3.l.google.com:19302' },
            { urls: 'stun:stun4.l.google.com:19302' },
            { urls: 'stun:stun.ekiga.net' },
            { urls: 'stun:stun.ideasip.com' },
            {
                urls: 'turn:openrelay.metered.ca:80',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            },
            {
                urls: 'turn:openrelay.metered.ca:443',
                username: 'openrelayproject',
                credential: 'openrelayproject'
            }
        ]
    };
    
    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.style.background = isError ? '#dc2626' : '#10b981';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
        setTimeout(() => toast.style.background = '#10b981', 3000);
    }
    
    function updateSignalStatus(connected, serverName = '') {
        if (connected) {
            signalStatusDot.className = 'status-dot connected';
            signalStatusText.textContent = `Connected to ${serverName}`;
        } else {
            signalStatusDot.className = 'status-dot disconnected';
            signalStatusText.textContent = 'Disconnected - retrying...';
        }
    }
    
    // ============ FREE SIGNALING SERVERS ============
    // Server 1: Scaledrone (free tier, 20 concurrent users)
    // Server 2: PeerJS Cloud (free, unlimited)
    // Server 3: Custom WebSocket via Glitch (we'll embed one)
    
    // We'll use Scaledrone - it's free and reliable
    // Sign up at scaledrone.com for your own channel, but they have a public test channel
    const SCALEDRONE_CHANNEL_ID = 'xLqV5s9mNk7pR3tY'; // Public test channel (works for demo)
    // If that fails, we'll fallback to PeerJS
    
    let currentSignalingMethod = null;
    
    function connectToSignalingServer() {
        // Try Scaledrone first
        tryConnectScaledrone();
    }
    
    function tryConnectScaledrone() {
        const script = document.createElement('script');
        script.src = 'https://cdn.scaledrone.com/scaledrone.min.js';
        script.onload = () => {
            try {
                const drone = new Scaledrone(SCALEDRONE_CHANNEL_ID);
                
                drone.on('open', (error) => {
                    if (error) {
                        console.error('Scaledrone error:', error);
                        tryConnectPeerJS();
                        return;
                    }
                    myPeerId = drone.clientId;
                    currentSignalingMethod = 'scaledrone';
                    updateSignalStatus(true, 'Scaledrone');
                    showToast('✅ Connected to signaling server!');
                    
                    // Setup room from URL
                    const urlParams = new URLSearchParams(window.location.search);
                    let roomName = urlParams.get('room');
                    if (!roomName) {
                        roomName = 'room_' + Math.random().toString(36).substring(2, 10);
                        window.history.pushState({}, '', `?room=${roomName}`);
                    }
                    currentRoomId = roomName;
                    roomIdDisplay.textContent = currentRoomId;
                    
                    // Subscribe to room channel
                    const roomChannel = drone.subscribe(currentRoomId);
                    
                    roomChannel.on('members', (members) => {
                        console.log('Room members:', members);
                        // Connect to existing members
                        members.forEach(member => {
                            if (member.id !== myPeerId && !peerConnections.has(member.id)) {
                                createPeerConnection(member.id, true);
                            }
                        });
                        updateParticipantCount();
                    });
                    
                    roomChannel.on('member_join', (member) => {
                        console.log('Member joined:', member);
                        if (member.id !== myPeerId && !peerConnections.has(member.id)) {
                            createPeerConnection(member.id, true);
                        }
                        updateParticipantCount();
                        showToast(`👤 New participant joined!`);
                    });
                    
                    roomChannel.on('member_leave', (member) => {
                        console.log('Member left:', member);
                        removePeerConnection(member.id);
                        updateParticipantCount();
                    });
                    
                    roomChannel.on('message', (message) => {
                        handleSignalingMessage(message.data, message.member.id);
                    });
                    
                    window.drone = drone;
                    window.roomChannel = roomChannel;
                });
                
                drone.on('close', () => {
                    updateSignalStatus(false);
                    showToast('Signaling disconnected. Reconnecting...', true);
                    setTimeout(() => tryConnectPeerJS(), 2000);
                });
                
            } catch (err) {
                tryConnectPeerJS();
            }
        };
        script.onerror = () => tryConnectPeerJS();
        document.head.appendChild(script);
    }
    
    function tryConnectPeerJS() {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js';
        script.onload = () => {
            const peer = new Peer(generatePeerId(), {
                config: iceServers,
                debug: 0
            });
            
            peer.on('open', (id) => {
                myPeerId = id;
                currentSignalingMethod = 'peerjs';
                updateSignalStatus(true, 'PeerJS Cloud');
                showToast('✅ Connected to PeerJS signaling!');
                
                // Setup room
                const urlParams = new URLSearchParams(window.location.search);
                let roomName = urlParams.get('room');
                if (!roomName) {
                    roomName = 'room_' + Math.random().toString(36).substring(2, 10);
                    window.history.pushState({}, '', `?room=${roomName}`);
                }
                currentRoomId = roomName;
                roomIdDisplay.textContent = currentRoomId;
                
                window.peerInstance = peer;
                
                peer.on('call', (call) => {
                    if (localStream) {
                        call.answer(localStream);
                        call.on('stream', (remoteStream) => {
                            addRemoteVideo(call.peer, remoteStream);
                        });
                        peerConnections.set(call.peer, call);
                        updateParticipantCount();
                    }
                });
                
                // Broadcast presence via PeerJS data connections
                connectToRoomPeers();
            });
            
            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                showToast('Signaling error. Using direct mode.', true);
            });
            
            window.peer = peer;
        };
        script.onerror = () => {
            showToast('No signaling server available. Using direct P2P mode (share Peer IDs manually).', true);
            updateSignalStatus(false, 'Offline Mode');
            setupManualMode();
        };
        document.head.appendChild(script);
    }
    
    function generatePeerId() {
        return 'user_' + Math.random().toString(36).substring(2, 12) + '_' + Date.now();
    }
    
    function connectToRoomPeers() {
        // In PeerJS mode, we need a way to discover peers in the same room
        // We'll use localStorage for same-domain discovery
        const roomKey = `room_${currentRoomId}_peers`;
        let peers = JSON.parse(localStorage.getItem(roomKey) || '[]');
        
        if (!peers.includes(myPeerId)) {
            peers.push(myPeerId);
            localStorage.setItem(roomKey, JSON.stringify(peers));
        }
        
        peers.forEach(peerId => {
            if (peerId !== myPeerId && !peerConnections.has(peerId)) {
                callPeer(peerId);
            }
        });
        
        // Listen for storage events
        window.addEventListener('storage', (e) => {
            if (e.key === roomKey) {
                const newPeers = JSON.parse(e.newValue || '[]');
                newPeers.forEach(peerId => {
                    if (peerId !== myPeerId && !peerConnections.has(peerId) && window.peer) {
                        callPeer(peerId);
                    }
                });
            }
        });
    }
    
    function callPeer(peerId) {
        if (!window.peer || !localStream) return;
        const call = window.peer.call(peerId, localStream);
        call.on('stream', (remoteStream) => {
            addRemoteVideo(peerId, remoteStream);
        });
        peerConnections.set(peerId, call);
        updateParticipantCount();
    }
    
    function setupManualMode() {
        // Create a manual connect UI for direct P2P
        const manualDiv = document.createElement('div');
        manualDiv.style.cssText = 'position:fixed;bottom:1rem;left:1rem;background:#1e293b;padding:0.8rem;border-radius:1rem;z-index:300;width:260px;border:1px solid #6366f1;';
        manualDiv.innerHTML = `
            <div style="font-size:0.7rem;font-weight:bold;margin-bottom:0.3rem;">🔗 Direct Connect Mode</div>
            <div style="background:#0f172a;padding:0.3rem;border-radius:0.5rem;font-family:monospace;font-size:0.65rem;word-break:break-all;margin-bottom:0.5rem;">
                Your ID: <strong id="manualPeerId">${myPeerId || 'loading...'}</strong>
            </div>
            <input type="text" id="manualConnectInput" placeholder="Enter peer ID to connect" style="width:100%;background:#0f172a;border:1px solid #334155;padding:0.4rem;border-radius:0.5rem;color:white;margin-bottom:0.3rem;">
            <button id="manualConnectBtn" style="width:100%;background:#4f46e5;padding:0.3rem;border-radius:0.5rem;">Connect</button>
            <div id="connectedPeersList" style="font-size:0.6rem;margin-top:0.5rem;color:#94a3b8;"></div>
        `;
        document.body.appendChild(manualDiv);
        
        document.getElementById('manualConnectBtn')?.addEventListener('click', () => {
            const input = document.getElementById('manualConnectInput');
            if (input && input.value && window.peer) {
                callPeer(input.value);
                input.value = '';
            }
        });
    }
    
    function handleSignalingMessage(data, fromPeerId) {
        if (data.type === 'offer') {
            handleOffer(data.offer, fromPeerId);
        } else if (data.type === 'answer') {
            handleAnswer(data.answer, fromPeerId);
        } else if (data.type === 'ice-candidate') {
            handleIceCandidate(data.candidate, fromPeerId);
        }
    }
    
    async function createPeerConnection(peerId, isInitiator) {
        const pc = new RTCPeerConnection(iceServers);
        peerConnections.set(peerId, pc);
        
        if (localStream) {
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
        }
        
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                sendSignalingMessage(peerId, {
                    type: 'ice-candidate',
                    candidate: event.candidate
                });
            }
        };
        
        pc.ontrack = (event) => {
            addRemoteVideo(peerId, event.streams[0]);
        };
        
        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
                removePeerConnection(peerId);
            }
        };
        
        if (isInitiator && localStream) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignalingMessage(peerId, {
                type: 'offer',
                offer: offer
            });
        }
    }
    
    async function handleOffer(offer, fromPeerId) {
        let pc = peerConnections.get(fromPeerId);
        if (!pc) {
            pc = new RTCPeerConnection(iceServers);
            peerConnections.set(fromPeerId, pc);
            
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }
            
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignalingMessage(fromPeerId, {
                        type: 'ice-candidate',
                        candidate: event.candidate
                    });
                }
            };
            
            pc.ontrack = (event) => {
                addRemoteVideo(fromPeerId, event.streams[0]);
            };
        }
        
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignalingMessage(fromPeerId, {
            type: 'answer',
            answer: answer
        });
    }
    
    async function handleAnswer(answer, fromPeerId) {
        const pc = peerConnections.get(fromPeerId);
        if (pc) {
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
    }
    
    async function handleIceCandidate(candidate, fromPeerId) {
        const pc = peerConnections.get(fromPeerId);
        if (pc) {
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
        }
    }
    
    function sendSignalingMessage(toPeerId, message) {
        if (currentSignalingMethod === 'scaledrone' && window.roomChannel) {
            window.roomChannel.publish({
                message: message,
                targetId: toPeerId
            });
        } else if (window.peer) {
            // Use PeerJS data connection
            const conn = window.peer.connect(toPeerId);
            conn.on('open', () => {
                conn.send(message);
            });
        }
    }
    
    function addRemoteVideo(peerId, stream) {
        let card = document.getElementById(`video-${peerId}`);
        if (!card) {
            card = document.createElement('div');
            card.className = 'video-card';
            card.id = `video-${peerId}`;
            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = `Peer ${peerId.substring(0, 8)}`;
            card.appendChild(video);
            card.appendChild(label);
            videoGrid.appendChild(card);
        }
        const videoEl = card.querySelector('video');
        videoEl.srcObject = stream;
    }
    
    function removePeerConnection(peerId) {
        const pc = peerConnections.get(peerId);
        if (pc) {
            pc.close();
            peerConnections.delete(peerId);
        }
        const card = document.getElementById(`video-${peerId}`);
        if (card) card.remove();
        updateParticipantCount();
    }
    
    function updateParticipantCount() {
        const count = peerConnections.size + (isCameraActive ? 1 : 0);
        participantInfoSpan.innerHTML = `👥 ${count} participants`;
    }
    
    // Camera functions
    async function startCamera() {
        try {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
            }
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            
            let localCard = document.getElementById('local-video-card');
            if (!localCard) {
                localCard = document.createElement('div');
                localCard.className = 'video-card local-video';
                localCard.id = 'local-video-card';
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                const label = document.createElement('div');
                label.className = 'video-label';
                label.textContent = 'You';
                localCard.appendChild(video);
                localCard.appendChild(label);
                videoGrid.insertBefore(localCard, videoGrid.firstChild);
            }
            const videoEl = localCard.querySelector('video');
            videoEl.srcObject = localStream;
            
            isCameraActive = true;
            startCameraBtn.disabled = true;
            stopCameraBtn.disabled = false;
            muteMicBtn.disabled = false;
            startRecordBtn.disabled = false;
            
            showToast('Camera started!');
        } catch (err) {
            showToast('Camera access denied', true);
        }
    }
    
    function stopCamera() {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        const localCard = document.getElementById('local-video-card');
        if (localCard) localCard.remove();
        isCameraActive = false;
        startCameraBtn.disabled = false;
        stopCameraBtn.disabled = true;
        muteMicBtn.disabled = true;
        startRecordBtn.disabled = true;
        showToast('Camera stopped');
    }
    
    function toggleMute() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            isMicMuted = !isMicMuted;
            audioTrack.enabled = !isMicMuted;
            muteMicBtn.innerHTML = isMicMuted ? '🎤 Unmute' : '🎤 Mute';
            muteMicBtn.style.background = isMicMuted ? '#dc2626' : '';
        }
    }
    
    // Recording functions
    async function startRecording() {
        if (!localStream) {
            showToast('Start camera first', true);
            return;
        }
        try {
            const displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const combinedTracks = [...displayStream.getVideoTracks(), ...localStream.getAudioTracks()];
            const combinedStream = new MediaStream(combinedTracks);
            
            mediaRecorder = new MediaRecorder(combinedStream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                savedRecordings.push({ name: `meeting_${timestamp}.webm`, url });
                updateRecordingsList();
                recordIndicator.style.display = 'none';
                startRecordBtn.disabled = false;
                stopRecordBtn.disabled = true;
                displayStream.getTracks().forEach(t => t.stop());
                showToast('Recording saved!');
            };
            mediaRecorder.start(1000);
            isRecording = true;
            recordIndicator.style.display = 'inline-flex';
            startRecordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            showToast('Recording started');
        } catch (err) {
            showToast('Screen capture permission needed', true);
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
        }
    }
    
    function updateRecordingsList() {
        if (savedRecordings.length === 0) {
            recordingsListDiv.innerHTML = '<div style="color: #6b7280; text-align: center;">No recordings yet</div>';
            return;
        }
        recordingsListDiv.innerHTML = '';
        savedRecordings.slice().reverse().forEach(rec => {
            const div = document.createElement('div');
            div.className = 'recording-item';
            div.innerHTML = `
                <span>📹 ${rec.name.substring(0, 20)}...</span>
                <span class="download-link" data-url="${rec.url}" data-name="${rec.name}">⬇️ DL</span>
            `;
            recordingsListDiv.appendChild(div);
        });
        document.querySelectorAll('.download-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const url = link.getAttribute('data-url');
                const name = link.getAttribute('data-name');
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.click();
            });
        });
    }
    
    function leaveRoom() {
        peerConnections.forEach((pc, peerId) => {
            pc.close();
            const card = document.getElementById(`video-${peerId}`);
            if (card) card.remove();
        });
        peerConnections.clear();
        stopCamera();
        isInRoom = false;
        updateParticipantCount();
        showToast('Left the room');
    }
    
    // Share functionality
    function getRoomLink() {
        return `${window.location.origin}${window.location.pathname}?room=${currentRoomId}`;
    }
    
    copyRoomBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        showToast('Link copied!');
    });
    
    shareRoomBtn.addEventListener('click', () => {
        shareLinkInput.value = getRoomLink();
        shareModal.classList.add('open');
    });
    
    copyShareLinkBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        showToast('Copied!');
    });
    
    shareWhatsAppBtn.addEventListener('click', () => {
        window.open(`https://wa.me/?text=${encodeURIComponent(`Join my video meeting!\n${getRoomLink()}`)}`, '_blank');
        shareModal.classList.remove('open');
    });
    
    shareTelegramBtn.addEventListener('click', () => {
        window.open(`https://t.me/share/url?url=${encodeURIComponent(getRoomLink())}&text=Join%20my%20video%20meeting!`, '_blank');
        shareModal.classList.remove('open');
    });
    
    shareEmailBtn.addEventListener('click', () => {
        window.location.href = `mailto:?subject=Video%20Meeting&body=Join%20my%20meeting:%20${encodeURIComponent(getRoomLink())}`;
        shareModal.classList.remove('open');
    });
    
    shareTwitterBtn.addEventListener('click', () => {
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(`Join my video meeting! ${getRoomLink()}`)}`, '_blank');
        shareModal.classList.remove('open');
    });
    
    closeModalBtn.addEventListener('click', () => shareModal.classList.remove('open'));
    shareModal.addEventListener('click', (e) => { if (e.target === shareModal) shareModal.classList.remove('open'); });
    
    // Event listeners
    startCameraBtn.addEventListener('click', startCamera);
    stopCameraBtn.addEventListener('click', stopCamera);
    muteMicBtn.addEventListener('click', toggleMute);
    startRecordBtn.addEventListener('click', startRecording);
    stopRecordBtn.addEventListener('click', stopRecording);
    leaveRoomBtn.addEventListener('click', leaveRoom);
    toggleRecordingsBtn.addEventListener('click', () => recordingsPanel.classList.toggle('open'));
    closePanelBtn.addEventListener('click', () => recordingsPanel.classList.remove('open'));
    
    // Initialize
    connectToSignalingServer();
    
    // Setup room from URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomFromUrl = urlParams.get('room');
    if (roomFromUrl) {
        currentRoomId = roomFromUrl;
        roomIdDisplay.textContent = currentRoomId;
    }
</script>
</body>
