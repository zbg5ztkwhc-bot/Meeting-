<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeetHub - 20+ Participant Video Conference + Recording + Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            background: linear-gradient(145deg, #0a0f1e 0%, #0f172a 100%);
            min-height: 100vh;
            color: #e2e8f0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0.75rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .room-controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            background: #1e293b;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
        }

        .copy-btn, .share-btn, .leave-btn {
            background: #334155;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            color: white;
        }

        .share-btn {
            background: #10b981;
        }

        .share-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .leave-btn {
            background: #dc2626;
        }

        .copy-btn:hover { background: #475569; }
        .leave-btn:hover { background: #b91c1c; }

        /* Main video grid - scrollable for many participants */
        .video-grid-container {
            flex: 1;
            overflow-y: auto;
            margin: 0.75rem 0;
            min-height: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
            padding: 0.25rem;
        }

        .video-card {
            background: #020617;
            border-radius: 0.8rem;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
            transition: all 0.2s;
            aspect-ratio: 16 / 9;
        }

        .video-card:hover {
            border-color: #6366f1;
            transform: scale(1.01);
            z-index: 10;
        }

        .video-label {
            background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent);
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .local-video video {
            transform: scaleX(-1);
        }

        /* Controls bar */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            margin-top: 0.5rem;
            flex-shrink: 0;
        }

        button {
            background: #2d3a5e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: #4f46e5; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; color: #0f172a; }

        .recording-badge {
            background: #1e1b4b;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.5; transform: scale(1.3);}
            100% { opacity: 1; transform: scale(1);}
        }

        .sidebar-info {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            z-index: 100;
            pointer-events: none;
        }

        .recordings-panel {
            position: fixed;
            top: 5rem;
            right: 1rem;
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            padding: 0.8rem;
            border: 1px solid #334155;
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.3s;
            pointer-events: auto;
        }

        .recordings-panel.open {
            transform: translateX(0);
        }

        .recordings-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }

        .recordings-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .recording-item {
            background: #1e293b;
            margin: 0.3rem 0;
            padding: 0.4rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .download-link {
            background: #3b4252;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            cursor: pointer;
            font-size: 0.65rem;
        }

        .toggle-panel {
            position: fixed;
            bottom: 5rem;
            right: 1rem;
            background: #4f46e5;
            border-radius: 3rem;
            padding: 0.5rem 1rem;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 200;
        }

        /* Share modal */
        .share-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
 backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .share-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .share-modal-content {
            background: #1e293b;
            border-radius: 1.5rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            border: 1px solid #6366f1;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }

        .share-modal-content h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .share-link-container {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .share-link-container input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 0.6rem;
            border-radius: 0.8rem;
            color: white;
            font-size: 0.8rem;
        }

        .share-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .share-buttons button {
            flex: 1;
            justify-content: center;
        }

        .close-modal {
            background: #334155;
            margin-top: 1rem;
            width: 100%;
        }

        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
            button {
                padding: 0.4rem 0.8rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">
            <h1>🎥 MeetHub</h1>
            <p style="font-size: 0.65rem;">20+ participant SFU conference • Record • Share</p>
        </div>
        <div class="room-controls">
            <span>🔑 Room: <strong id="roomIdDisplay">---</strong></span>
            <button class="copy-btn" id="copyRoomBtn">📋 Copy link</button>
            <button class="share-btn" id="shareRoomBtn">📤 Share</button>
            <button class="leave-btn" id="leaveRoomBtn">🚪 Leave</button>
        </div>
    </div>

    <div class="video-grid-container" id="videoGridContainer">
        <div id="videoGrid" class="video-grid"></div>
    </div>

    <div class="controls-bar">
        <button id="joinRoomBtn" class="btn-primary">🎙️ Join / Create Room</button>
        <button id="toggleMediaBtn" class="btn-primary">🎥 Start Camera</button>
        <button id="stopMediaBtn" class="btn-warning" disabled>⏹️ Stop</button>
        <button id="toggleMicBtn" disabled>🎤 Mute</button>
        <button id="startRecordingBtn" class="btn-success" disabled>🔴 Record Meeting</button>
        <button id="stopRecordingBtn" class="btn-danger" disabled>⏹️ Stop Recording</button>
        <div id="recordIndicator" style="display: none;" class="recording-badge">
            <span class="red-dot"></span> <span>REC</span>
        </div>
    </div>

    <div class="sidebar-info" id="participantInfo">
        👥 0 participants
    </div>
    <div class="toggle-panel" id="toggleRecordingsBtn">
        📼 Recordings
    </div>
    <div class="recordings-panel" id="recordingsPanel">
        <div class="recordings-header">
            <strong>💾 Saved Recordings</strong>
            <span style="cursor:pointer;" id="closePanelBtn">✖️</span>
        </div>
        <div id="recordingsList" class="recordings-list">
            <div style="color: #6b7280; text-align: center;">No recordings yet</div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="share-modal" id="shareModal">
        <div class="share-modal-content">
            <h3>📢 Invite to Meeting</h3>
            <p style="margin-bottom: 0.5rem;">Share this link with up to 50+ participants:</p>
            <div class="share-link-container">
                <input type="text" id="shareLinkInput" readonly>
                <button id="copyShareLinkBtn" style="padding: 0.6rem 1rem;">Copy</button>
            </div>
            <div class="share-buttons">
                <button id="shareWhatsAppBtn">💬 WhatsApp</button>
                <button id="shareTelegramBtn">✈️ Telegram</button>
                <button id="shareEmailBtn">📧 Email</button>
                <button id="shareTwitterBtn">🐦 X (Twitter)</button>
            </div>
            <button class="close-modal" id="closeModalBtn">Close</button>
        </div>
    </div>
</div>

<script>
    // ==================== LiveKit SFU Integration ====================
    // Load LiveKit SDK dynamically
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/livekit-client@1.15.0/dist/livekit-client.umd.js';
    script.onload = () => initLiveKit();
    document.head.appendChild(script);
    
    let room = null;
    let isConnected = false;
    let isCameraActive = false;
    let isMicMuted = false;
    
    // Recording via MediaRecorder
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let screenStream = null;
    let savedRecordings = [];
    
    // DOM elements
    const videoGrid = document.getElementById('videoGrid');
    const roomIdDisplay = document.getElementById('roomIdDisplay');
    const copyRoomBtn = document.getElementById('copyRoomBtn');
    const shareRoomBtn = document.getElementById('shareRoomBtn');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const toggleMediaBtn = document.getElementById('toggleMediaBtn');
    const stopMediaBtn = document.getElementById('stopMediaBtn');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const startRecordingBtn = document.getElementById('startRecordingBtn');
    const stopRecordingBtn = document.getElementById('stopRecordingBtn');
    const recordIndicator = document.getElementById('recordIndicator');
    const participantInfoSpan = document.getElementById('participantInfo');
    const recordingsPanel = document.getElementById('recordingsPanel');
    const toggleRecordingsBtn = document.getElementById('toggleRecordingsBtn');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const recordingsListDiv = document.getElementById('recordingsList');
    
    // Share modal elements
    const shareModal = document.getElementById('shareModal');
    const shareLinkInput = document.getElementById('shareLinkInput');
    const copyShareLinkBtn = document.getElementById('copyShareLinkBtn');
    const shareWhatsAppBtn = document.getElementById('shareWhatsAppBtn');
    const shareTelegramBtn = document.getElementById('shareTelegramBtn');
    const shareEmailBtn = document.getElementById('shareEmailBtn');
    const shareTwitterBtn = document.getElementById('shareTwitterBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    
    let currentRoomName = null;
    
    // Generate or get room from URL
    function initRoom() {
        const urlParams = new URLSearchParams(window.location.search);
        let roomName = urlParams.get('room');
        if (!roomName) {
            roomName = 'meeting_' + Math.random().toString(36).substring(2, 12);
            window.history.pushState({}, '', `?room=${roomName}`);
        }
        currentRoomName = roomName;
        roomIdDisplay.textContent = roomName;
        updateShareLink();
    }
    
    function getRoomLink() {
        return `${window.location.origin}${window.location.pathname}?room=${currentRoomName}`;
    }
    
    function updateShareLink() {
        if (shareLinkInput) {
            shareLinkInput.value = getRoomLink();
        }
    }
    
    // Share functionality
    copyRoomBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        copyRoomBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyRoomBtn.textContent = '📋 Copy link'; }, 2000);
    });
    
    // Open share modal
    shareRoomBtn.addEventListener('click', () => {
        updateShareLink();
        shareModal.classList.add('open');
    });
    
    function closeShareModal() {
        shareModal.classList.remove('open');
    }
    
    copyShareLinkBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(getRoomLink());
        copyShareLinkBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyShareLinkBtn.textContent = 'Copy'; }, 2000);
    });
    
    // Share to WhatsApp
    shareWhatsAppBtn.addEventListener('click', () => {
        const text = encodeURIComponent(`Join my video meeting on MeetHub!\n${getRoomLink()}`);
        window.open(`https://wa.me/?text=${text}`, '_blank');
        closeShareModal();
    });
    
    // Share to Telegram
    shareTelegramBtn.addEventListener('click', () => {
        const text = encodeURIComponent(`Join my video meeting: ${getRoomLink()}`);
        window.open(`https://t.me/share/url?url=${encodeURIComponent(getRoomLink())}&text=Join%20my%20video%20meeting!`, '_blank');
        closeShareModal();
    });
    
    // Share via Email
    shareEmailBtn.addEventListener('click', () => {
        const subject = encodeURIComponent('Video Meeting Invitation');
        const body = encodeURIComponent(`You're invited to join my video meeting!\n\nClick this link to join: ${getRoomLink()}\n\nMeetHub - Multi-participant video conference`);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
        closeShareModal();
    });
    
    // Share to Twitter/X
    shareTwitterBtn.addEventListener('click', () => {
        const text = encodeURIComponent(`Join my video meeting on MeetHub! 🎥\n\n${getRoomLink()}`);
        window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        closeShareModal();
    });
    
    closeModalBtn.addEventListener('click', closeShareModal);
    
    // Close modal when clicking outside
    shareModal.addEventListener('click', (e) => {
        if (e.target === shareModal) closeShareModal();
    });
    
    // LiveKit connection
    async function connectToRoom() {
        if (room && room.state === 'connected') {
            console.log('Already connected');
            return;
        }
        
        const LIVEKIT_URL = 'wss://meet-verse-4lxbhxhw.livekit.cloud';
        const participantName = 'User_' + Math.floor(Math.random() * 10000);
        
        try {
            const tokenResponse = await fetch(`https://livekit-token-generator-2g3g.onrender.com/token?room=${currentRoomName}&identity=${participantName}`);
            if (!tokenResponse.ok) throw new Error('Failed to get token');
            const token = await tokenResponse.text();
            
            const LiveKitClient = window.LivekitClient;
            room = new LiveKitClient.Room();
            
            room.on(LiveKitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
            room.on(LiveKitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
            room.on(LiveKitClient.RoomEvent.ParticipantConnected, handleParticipantConnected);
            room.on(LiveKitClient.RoomEvent.ParticipantDisconnected, handleParticipantDisconnected);
            room.on(LiveKitClient.RoomEvent.Disconnected, () => {
                isConnected = false;
                updateParticipantCount();
                joinRoomBtn.disabled = false;
                toggleMediaBtn.disabled = true;
                stopMediaBtn.disabled = true;
                toggleMicBtn.disabled = true;
                participantInfoSpan.innerHTML = '👥 Disconnected';
            });
            
            await room.connect(LIVEKIT_URL, token);
            isConnected = true;
            updateParticipantCount();
            joinRoomBtn.disabled = true;
            toggleMediaBtn.disabled = false;
            stopMediaBtn.disabled = false;
            toggleMicBtn.disabled = false;
            startRecordingBtn.disabled = false;
            
            await enableMedia();
            
        } catch (err) {
            console.error('Connection failed:', err);
            alert('Connection failed. Please refresh or check your internet connection.\n\nNote: Public token server may have limits. For production, use your own LiveKit instance.');
        }
    }
    
    async function enableMedia() {
        if (!room || room.state !== 'connected') return;
        try {
            await room.localParticipant.enableCameraAndMicrophone();
            isCameraActive = true;
            isMicMuted = false;
            toggleMediaBtn.textContent = '📷 Camera On';
            toggleMicBtn.innerHTML = '🎤 Mute';
            toggleMicBtn.style.background = '';
            updateLocalVideoUI();
        } catch (err) {
            console.error('Media enable error:', err);
        }
    }
    
    async function disableMedia() {
        if (!room || room.state !== 'connected') return;
        await room.localParticipant.setCameraEnabled(false);
        await room.localParticipant.setMicrophoneEnabled(false);
        isCameraActive = false;
        toggleMediaBtn.textContent = '🎥 Start Camera';
        toggleMicBtn.innerHTML = '🎤 Mic Off';
        updateLocalVideoUI();
    }
    
    function toggleMute() {
        if (!room || room.state !== 'connected') return;
        const newMute = !isMicMuted;
        room.localParticipant.setMicrophoneEnabled(!newMute);
        isMicMuted = newMute;
        toggleMicBtn.innerHTML = isMicMuted ? '🎤 Unmute' : '🎤 Mute';
        toggleMicBtn.style.background = isMicMuted ? '#dc2626' : '';
    }
    
    function handleTrackSubscribed(track, publication, participant) {
        if (track.kind === 'video' || track.kind === 'audio') {
            addParticipantVideo(participant, track);
        }
    }
    
    function handleTrackUnsubscribed(track, publication, participant) {
        removeParticipantVideo(participant.identity);
    }
    
    function handleParticipantConnected(participant) {
        updateParticipantCount();
    }
    
    function handleParticipantDisconnected(participant) {
        removeParticipantVideo(participant.identity);
        updateParticipantCount();
    }
    
    function updateParticipantCount() {
        if (room && room.state === 'connected') {
            const count = room.participants.size + 1;
            participantInfoSpan.innerHTML = `👥 ${count} participants`;
        } else {
            participantInfoSpan.innerHTML = '👥 0 participants';
        }
    }
    
    function addParticipantVideo(participant, track) {
        let elementId = `video-${participant.identity}`;
        let container = document.getElementById(elementId);
        if (!container) {
            const videoCard = document.createElement('div');
            videoCard.className = 'video-card';
            videoCard.id = elementId;
            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = participant.name || participant.identity;
            videoCard.appendChild(video);
            videoCard.appendChild(label);
            videoGrid.appendChild(videoCard);
            container = videoCard;
        }
        const videoEl = container.querySelector('video');
        if (track.kind === 'video') {
            const mediaStream = new MediaStream([track.mediaStreamTrack]);
            videoEl.srcObject = mediaStream;
        }
    }
    
    function removeParticipantVideo(identity) {
        const element = document.getElementById(`video-${identity}`);
        if (element) element.remove();
    }
    
    function updateLocalVideoUI() {
        if (room && room.localParticipant && isCameraActive) {
            let localCard = document.getElementById('local-video-card');
            if (!localCard) {
                localCard = document.createElement('div');
                localCard.className = 'video-card local-video';
                localCard.id = 'local-video-card';
                const video = document.createElement('video');
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                const label = document.createElement('div');
                label.className = 'video-label';
                label.textContent = 'You (Local)';
                localCard.appendChild(video);
                localCard.appendChild(label);
                videoGrid.insertBefore(localCard, videoGrid.firstChild);
            }
            const videoTrack = room.localParticipant.videoTrackPublications.values().next().value;
            if (videoTrack && videoTrack.track) {
                const videoEl = localCard.querySelector('video');
                videoEl.srcObject = new MediaStream([videoTrack.track.mediaStreamTrack]);
            }
        } else if (!isCameraActive) {
            const localCard = document.getElementById('local-video-card');
            if (localCard) localCard.remove();
        }
    }
    
    // Client-side recording
    async function startClientRecording() {
        if (!room || room.state !== 'connected') {
            alert('Join a room first');
            return;
        }
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            mediaRecorder = new MediaRecorder(screenStream);
            recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                savedRecordings.push({ name: `meeting_${timestamp}.webm`, url });
                updateRecordingsList();
                recordIndicator.style.display = 'none';
                startRecordingBtn.disabled = false;
                stopRecordingBtn.disabled = true;
                if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start(1000);
            isRecording = true;
            recordIndicator.style.display = 'inline-flex';
            startRecordingBtn.disabled = true;
            stopRecordingBtn.disabled = false;
        } catch (err) {
            alert('Screen capture permission needed for recording');
        }
    }
    
    function stopClientRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
        }
    }
    
    function updateRecordingsList() {
        if (savedRecordings.length === 0) {
            recordingsListDiv.innerHTML = '<div style="color: #6b7280; text-align: center;">No recordings yet</div>';
            return;
        }
        recordingsListDiv.innerHTML = '';
        savedRecordings.slice().reverse().forEach(rec => {
            const div = document.createElement('div');
            div.className = 'recording-item';
            div.innerHTML = `
                <span>📹 ${rec.name}</span>
                <span class="download-link" data-url="${rec.url}" data-name="${rec.name}">⬇️ DL</span>
            `;
            recordingsListDiv.appendChild(div);
        });
        document.querySelectorAll('.download-link').forEach(link => {
            link.addEventListener('click', (e) => {
                const url = link.getAttribute('data-url');
                const name = link.getAttribute('data-name');
                const a = document.createElement('a');
                a.href = url;
                a.download = name;
                a.click();
            });
        });
    }
    
    function leaveRoom() {
        if (room) {
            room.disconnect();
            room = null;
        }
        videoGrid.innerHTML = '';
        isConnected = false;
        joinRoomBtn.disabled = false;
        toggleMediaBtn.disabled = true;
        stopMediaBtn.disabled = true;
        toggleMicBtn.disabled = true;
        startRecordingBtn.disabled = true;
        stopRecordingBtn.disabled = true;
        participantInfoSpan.innerHTML = '👥 0 participants';
    }
    
    // Event listeners
    joinRoomBtn.addEventListener('click', connectToRoom);
    toggleMediaBtn.addEventListener('click', enableMedia);
    stopMediaBtn.addEventListener('click', disableMedia);
    toggleMicBtn.addEventListener('click', toggleMute);
    startRecordingBtn.addEventListener('click', startClientRecording);
    stopRecordingBtn.addEventListener('click', stopClientRecording);
    leaveRoomBtn.addEventListener('click', leaveRoom);
    
    toggleRecordingsBtn.addEventListener('click', () => {
        recordingsPanel.classList.toggle('open');
    });
    closePanelBtn.addEventListener('click', () => {
        recordingsPanel.classList.remove('open');
    });
    
    function initLiveKit() {
        initRoom();
        console.log('LiveKit SDK loaded — Ready for 20+ participants! Share button active');
    }
    
    if (window.LivekitClient) {
        initLiveKit();
    }
</script>
</body>
</html>
