<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>HamoudaSpace · Working Video | Fixed WebRTC</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-dark: #05070c; --bg-card: #12161f; --bg-soft: #1a1f2c;
    --border-dim: #2a2f3e; --text-primary: #eef2ff; --text-secondary: #9ca3af;
    --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --success: #22c55e;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    background: var(--bg-dark); 
    color: var(--text-primary); 
    height: 100vh; 
    overflow: hidden;
  }
  .hidden { display: none !important; }
  .btn { padding: 12px 24px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer; font-size: 16px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-dim); }
  #view-lobby { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; background: radial-gradient(circle at 20% 30%, #0f121c, #020408); }
  .lobby-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(10,12,18,0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-dim); flex-wrap: wrap; gap: 10px; }
  .logo-area { display: flex; gap: 12px; align-items: center; }
  .logo-icon { width: 44px; height: 44px; background: var(--accent); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .lobby-actions { display: flex; gap: 10px; }
  .lobby-main { max-width: 700px; margin: 40px auto; padding: 20px; text-align: center; }
  .hero h1 { font-size: 1.6rem; margin-bottom: 12px; }
  .hero p { font-size: 14px; color: var(--text-secondary); }
  .action-cards { display: flex; gap: 16px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  .card { background: var(--bg-card); padding: 24px; border-radius: 28px; width: 220px; border: 1px solid var(--border-dim); }
  .card h3 { font-size: 18px; margin-bottom: 8px; }
  .card p { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  .card button { width: 100%; padding: 10px; font-size: 14px; }
  .info-box { margin-top: 30px; padding: 16px; background: rgba(59,130,246,0.1); border-radius: 20px; font-size: 12px; }
  #view-room { display: none; flex-direction: column; height: 100vh; background: #05070c; }
  .room-header { background: rgba(8,10,16,0.95); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
  .room-info { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .room-title { font-weight: 600; font-size: 12px; }
  .room-code { font-family: monospace; background: rgba(59,130,246,0.2); padding: 4px 10px; border-radius: 40px; font-size: 11px; cursor: pointer; }
  .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; }
  .status-badge.connected { background: rgba(34,197,94,0.3); color: #22c55e; }
  .status-badge.connecting { background: rgba(255,165,0,0.3); color: #ffa500; }
  .video-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px; background: #03050a; }
  .video-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); overflow-y: auto; padding: 4px; height: 100%; }
  .vtile { background: #11161f; border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 9/16; border: 1px solid rgba(255,255,255,0.08); }
  .vtile video { width: 100%; height: 100%; object-fit: cover; }
  .vtile .ph { display: flex; align-items: center; justify-content: center; height: 100%; background: #0a0e16; }
  .avatar-big { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }
  .vtile-bar { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; }
  .vtile-name { background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); padding: 3px 8px; border-radius: 30px; font-size: 9px; }
  .bottom-controls { background: rgba(8,10,16,0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); padding: 10px 12px; display: flex; justify-content: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
  .ctrl-btn { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; font-size: 22px; cursor: pointer; }
  .ctrl-btn.off { background: var(--danger); }
  .ctrl-btn.leave { background: var(--danger); }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1e1f2c; padding: 8px 18px; border-radius: 40px; z-index: 400; font-size: 12px; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 500; flex-direction: column; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #2a3048; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 600; padding: 20px; }
  .modal-card { background: var(--bg-card); border-radius: 28px; padding: 24px; width: 90%; max-width: 340px; }
  .modal-card input { width: 100%; margin-bottom: 12px; background: var(--bg-soft); border: 1px solid var(--border-dim); border-radius: 14px; padding: 12px; color: white; font-size: 16px; }
  @media (max-width: 480px) {
    .ctrl-btn { width: 44px; height: 44px; font-size: 18px; }
    .video-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
</style>
</head>
<body>

<div id="view-lobby">
  <div class="lobby-header">
    <div class="logo-area"><div class="logo-icon">🎥</div><div><strong>HamoudaSpace</strong><div style="font-size:10px;">Fixed WebRTC</div></div></div>
    <div class="lobby-actions">
      <button class="btn btn-secondary" id="showJoinBtn">🔗 Join</button>
      <button class="btn btn-primary" id="showCreateBtn">✨ New Meeting</button>
    </div>
  </div>
  <div class="lobby-main">
    <div class="hero"><h1>Video Meetings That Work</h1><p>Fixed WebRTC - Video & Audio working</p></div>
    <div class="action-cards">
      <div class="card"><h3>Start a Meeting</h3><button class="btn btn-primary" id="createCardBtn">Create Room</button></div>
      <div class="card"><h3>Join a Meeting</h3><button class="btn btn-secondary" id="joinCardBtn">Enter Code</button></div>
    </div>
    <div class="info-box">
      <p>🔵 <strong>Fixed!</strong> Allow camera/microphone access. Share the 6-digit code with others.</p>
    </div>
  </div>
</div>

<div id="view-room">
  <div class="room-header">
    <div class="room-info"><span class="room-title" id="roomNameDisplay">Meeting</span><span class="room-code" id="roomCodeDisplay" onclick="copyRoomCode()">XXXXXX</span></div>
    <div class="room-info"><span id="participantCount">👥 1</span><span id="connectionStatus" class="status-badge connecting">🟡 Connecting...</span></div>
  </div>
  <div class="video-section"><div class="video-grid" id="videoGridContainer"></div></div>
  <div class="bottom-controls"><button class="ctrl-btn" id="micBtn">🎤</button><button class="ctrl-btn" id="camBtn">📷</button><div class="divider"></div><button class="ctrl-btn leave" id="leaveRoomBtn">🚪</button></div>
</div>

<div id="createModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">New Meeting</div><input id="createRoomName" placeholder="Meeting name"><input id="createUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelCreateModal" class="btn btn-secondary">Cancel</button><button id="confirmCreateModal" class="btn btn-primary">Create</button></div></div></div>
<div id="joinModal" class="modal-backdrop hidden"><div class="modal-card"><div style="font-size:20px; margin-bottom:16px;">Join Meeting</div><input id="joinRoomCode" maxlength="6" placeholder="6-letter code" style="text-transform:uppercase"><input id="joinUserName" placeholder="Your name"><div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;"><button id="cancelJoinModal" class="btn btn-secondary">Cancel</button><button id="confirmJoinModal" class="btn btn-primary">Join</button></div></div></div>
<div id="loadingOverlay" class="overlay hidden"><div class="spinner"></div><p>Starting camera...</p></div>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCra3IgsAaQlf3INjRn04DdX3KWwb8zdlo",
  authDomain: "hamoudaspace-meetingapp.firebaseapp.com",
  projectId: "hamoudaspace-meetingapp",
  storageBucket: "hamoudaspace-meetingapp.firebasestorage.app",
  messagingSenderId: "9931981197",
  appId: "1:9931981197:web:716e61223950d3d39c7dc4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// State
let localStream = null;
let peerConnections = new Map();
let isHost = false;
let roomCode = '';
let myName = '';
let roomName = '';
let myPeerId = '';
let isMuted = false;
let isCamOff = false;
let participants = new Map();
let unsubscribeParticipants = null;
let unsubscribeSignals = null;

// ICE Servers
const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun3.l.google.com:19302' },
    { urls: 'stun:stun4.l.google.com:19302' },
    { urls: 'stun:stun.stunprotocol.org:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function genCode() { return Math.random().toString(36).slice(2,8).toUpperCase(); }
function genPeerId() { return 'p_' + Math.random().toString(36).slice(2,10); }

function toast(msg) { 
  let t = document.querySelector('.toast'); 
  if(t) t.remove(); 
  t = document.createElement('div'); 
  t.className = 'toast'; 
  t.innerText = msg; 
  document.body.appendChild(t); 
  setTimeout(() => t.remove(), 3000); 
}

function showOverlay(msg) { 
  let ov = document.getElementById('loadingOverlay'); 
  ov.classList.remove('hidden'); 
  ov.querySelector('p').innerText = msg; 
}
function hideOverlay() { document.getElementById('loadingOverlay').classList.add('hidden'); }

function showLobby() { 
  document.getElementById('view-lobby').style.display = 'flex'; 
  document.getElementById('view-room').style.display = 'none'; 
  hideOverlay(); 
  closeAllModals(); 
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  if(unsubscribeParticipants) unsubscribeParticipants();
  if(unsubscribeSignals) unsubscribeSignals();
  peerConnections.forEach(pc => pc.close());
  peerConnections.clear();
  participants.clear();
}

function showRoom() { 
  document.getElementById('view-lobby').style.display = 'none'; 
  document.getElementById('view-room').style.display = 'flex'; 
  hideOverlay(); 
}

function closeAllModals() { 
  document.getElementById('createModal').classList.add('hidden'); 
  document.getElementById('joinModal').classList.add('hidden'); 
}

function escapeHtml(s) { 
  return String(s).replace(/[&<>]/g, function(m) { 
    if(m === '&') return '&amp;'; 
    if(m === '<') return '&lt;'; 
    if(m === '>') return '&gt;'; 
    return m; 
  }); 
}

function updateParticipantCount() { 
  document.getElementById('participantCount').innerHTML = `👥 ${participants.size + 1}`; 
}

// ========== FIREBASE SIGNALING ==========
async function sendSignal(data) {
  if(!roomCode) return;
  try {
    await db.collection('rooms').doc(roomCode).collection('signals').add({
      from: myPeerId,
      data: data,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { console.error('Send signal error:', e); }
}

// ========== WEBRTC PEER CONNECTION ==========
async function createPeerConnection(targetPeerId, isInitiator) {
  console.log(`Creating connection with ${targetPeerId}, initiator: ${isInitiator}`);
  
  const pc = new RTCPeerConnection(ICE_SERVERS);
  peerConnections.set(targetPeerId, pc);
  
  // Add local tracks to the connection
  if(localStream) {
    localStream.getTracks().forEach(track => {
      pc.addTrack(track, localStream);
    });
  }
  
  // Handle incoming remote tracks
  pc.ontrack = (event) => {
    console.log(`Received track from ${targetPeerId}, kind: ${event.track.kind}`);
    document.getElementById('connectionStatus').className = 'status-badge connected';
    document.getElementById('connectionStatus').innerHTML = '🟢 Connected';
    
    // Create video element for this peer if not exists
    let videoEl = document.getElementById(`vid-${targetPeerId}`);
    if(!videoEl) {
      // Force grid refresh
      renderGrid();
      videoEl = document.getElementById(`vid-${targetPeerId}`);
    }
    
    if(videoEl && event.streams[0]) {
      videoEl.srcObject = event.streams[0];
      videoEl.setAttribute('playsinline', 'true');
      videoEl.play().catch(e => console.log('Play error:', e));
      
      // Hide placeholder
      const ph = document.getElementById(`ph-${targetPeerId}`);
      if(ph) ph.style.display = 'none';
      if(videoEl) videoEl.style.display = 'block';
    }
  };
  
  // Handle ICE candidates
  pc.onicecandidate = (event) => {
    if(event.candidate) {
      sendSignal({ type: 'candidate', candidate: event.candidate, target: targetPeerId });
    }
  };
  
  // Monitor connection state
  pc.onconnectionstatechange = () => {
    console.log(`Connection state with ${targetPeerId}: ${pc.connectionState}`);
    if(pc.connectionState === 'connected') {
      document.getElementById('connectionStatus').className = 'status-badge connected';
      document.getElementById('connectionStatus').innerHTML = '🟢 Connected';
    } else if(pc.connectionState === 'failed') {
      document.getElementById('connectionStatus').className = 'status-badge connecting';
      document.getElementById('connectionStatus').innerHTML = '🔴 Failed - retrying';
    }
  };
  
  // Create offer if we are the initiator
  if(isInitiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ type: 'offer', sdp: offer, target: targetPeerId });
  }
  
  return pc;
}

async function handleSignal(signal) {
  const from = signal.from;
  const data = signal.data;
  
  // Ignore signals not meant for us
  if(data.target && data.target !== myPeerId) return;
  
  let pc = peerConnections.get(from);
  
  // Create peer connection if needed for offer
  if(data.type === 'offer' && !pc) {
    pc = await createPeerConnection(from, false);
  }
  
  if(!pc) return;
  
  try {
    if(data.type === 'offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', sdp: answer, target: from });
    } 
    else if(data.type === 'answer') {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    } 
    else if(data.type === 'candidate') {
      if(data.candidate) {
        await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    }
  } catch(e) {
    console.error('Signal handling error:', e);
  }
}

// ========== ROOM MANAGEMENT ==========
async function setupRoomSignaling() {
  const roomRef = db.collection('rooms').doc(roomCode);
  
  // Register this participant
  await roomRef.collection('participants').doc(myPeerId).set({
    name: myName,
    isHost: isHost,
    joinedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  // Listen for new participants
  unsubscribeParticipants = roomRef.collection('participants').onSnapshot(async (snapshot) => {
    for (const change of snapshot.docChanges()) {
      const pid = change.doc.id;
      if(pid === myPeerId) continue;
      
      if(change.type === 'added') {
        const data = change.doc.data();
        console.log(`New participant: ${pid}, name: ${data.name}`);
        
        if(!participants.has(pid) && !peerConnections.has(pid)) {
          participants.set(pid, { name: data.name });
          renderGrid();
          updateParticipantCount();
          toast(`${data.name} joined`);
          
          // Initiate connection to new participant
          await createPeerConnection(pid, true);
        }
      }
      else if(change.type === 'removed') {
        console.log(`Participant left: ${pid}`);
        const pc = peerConnections.get(pid);
        if(pc) pc.close();
        peerConnections.delete(pid);
        participants.delete(pid);
        const tile = document.getElementById(`tile-${pid}`);
        if(tile) tile.remove();
        renderGrid();
        updateParticipantCount();
      }
    }
  });
  
  // Listen for signals
  unsubscribeSignals = roomRef.collection('signals').orderBy('timestamp').onSnapshot(async (snapshot) => {
    for (const change of snapshot.docChanges()) {
      if(change.type === 'added') {
        const signal = change.doc.data();
        if(signal.from !== myPeerId) {
          await handleSignal(signal);
        }
        // Clean up
        try { await change.doc.ref.delete(); } catch(e) {}
      }
    }
  });
  
  document.getElementById('connectionStatus').className = 'status-badge connecting';
  document.getElementById('connectionStatus').innerHTML = '🟡 Waiting...';
}

// ========== CREATE ROOM ==========
async function createRoom() {
  const roomNameInput = document.getElementById('createRoomName').value.trim();
  const userName = document.getElementById('createUserName').value.trim();
  if(!roomNameInput || !userName) { toast('Fill all fields'); return; }
  closeAllModals(); 
  showOverlay('Starting camera...');
  
  isHost = true;
  roomCode = genCode();
  myName = userName;
  roomName = roomNameInput;
  myPeerId = genPeerId();
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ 
      audio: true, 
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
    });
    console.log('Local stream acquired:', localStream.getTracks().length, 'tracks');
  } catch(e) {
    showLobby(); 
    toast('Camera/microphone access required');
    return;
  }
  
  // Create room in Firestore
  await db.collection('rooms').doc(roomCode).set({
    name: roomName,
    host: myPeerId,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  
  document.getElementById('roomNameDisplay').innerText = roomName;
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  renderGrid(); 
  showRoom(); 
  toast(`Room created! Share code: ${roomCode}`);
  
  await setupRoomSignaling();
}

// ========== JOIN ROOM ==========
async function joinRoom() {
  const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
  const userName = document.getElementById('joinUserName').value.trim();
  if(!code || !userName || code.length !== 6) { toast('Valid 6-character code required'); return; }
  closeAllModals(); 
  showOverlay('Starting camera...');
  
  // Check if room exists
  const roomDoc = await db.collection('rooms').doc(code).get();
  if(!roomDoc.exists) {
    showLobby();
    toast('Room not found');
    return;
  }
  
  isHost = false;
  roomCode = code;
  myName = userName;
  roomName = roomDoc.data().name;
  myPeerId = genPeerId();
  
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ 
      audio: true, 
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
    });
    console.log('Local stream acquired:', localStream.getTracks().length, 'tracks');
  } catch(e) {
    showLobby(); 
    toast('Camera/microphone access required');
    return;
  }
  
  document.getElementById('roomNameDisplay').innerText = roomName;
  document.getElementById('roomCodeDisplay').innerText = roomCode;
  renderGrid(); 
  showRoom();
  toast(`Joined ${roomName}`);
  
  await setupRoomSignaling();
}

// ========== VIDEO GRID ==========
function renderGrid() {
  const container = document.getElementById('videoGridContainer');
  container.innerHTML = '';
  
  // Add local video
  container.appendChild(createTile('local', `${myName} (you)`, localStream, true));
  
  // Add remote participants
  for(let [peerId, p] of participants.entries()) {
    container.appendChild(createTile(peerId, p.name, null, false));
  }
  
  updateParticipantCount();
}

function createTile(id, name, stream, isLocal) {
  const tile = document.createElement('div'); 
  tile.className = 'vtile'; 
  tile.id = `tile-${id}`;
  
  const ph = document.createElement('div'); 
  ph.className = 'ph'; 
  ph.id = `ph-${id}`;
  ph.innerHTML = `<div class="avatar-big">${(name[0] || '?').toUpperCase()}</div>`;
  
  const video = document.createElement('video'); 
  video.id = `vid-${id}`; 
  video.autoplay = true; 
  video.playsInline = true; 
  video.muted = isLocal;
  video.setAttribute('playsinline', 'true');
  
  if(stream && stream.getVideoTracks().length > 0 && !isCamOff) { 
    video.srcObject = stream; 
    video.style.display = 'block'; 
    ph.style.display = 'none'; 
    video.play().catch(e => console.log('play error', e));
  } else { 
    video.style.display = 'none'; 
    ph.style.display = 'flex'; 
  }
  
  const bar = document.createElement('div'); 
  bar.className = 'vtile-bar';
  bar.innerHTML = `<div class="vtile-name">${escapeHtml(name)}</div>`;
  if(isLocal && isMuted) bar.innerHTML += `<div style="background:#ef4444; border-radius:20px; padding:2px 6px; font-size:9px;">🔇</div>`;
  
  tile.appendChild(ph); 
  tile.appendChild(video); 
  tile.appendChild(bar);
  return tile;
}

// ========== MEDIA CONTROLS ==========
document.getElementById('micBtn').onclick = () => { 
  if(localStream) { 
    isMuted = !isMuted; 
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted); 
    document.getElementById('micBtn').classList.toggle('off', isMuted);
  } 
};

document.getElementById('camBtn').onclick = () => { 
  if(localStream) { 
    isCamOff = !isCamOff; 
    localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff); 
    document.getElementById('camBtn').classList.toggle('off', isCamOff); 
    renderGrid(); 
  } 
};

function leaveRoom() { 
  if(unsubscribeParticipants) unsubscribeParticipants();
  if(unsubscribeSignals) unsubscribeSignals();
  if(roomCode && myPeerId) {
    db.collection('rooms').doc(roomCode).collection('participants').doc(myPeerId).delete().catch(()=>{});
  }
  peerConnections.forEach(pc => pc.close());
  if(localStream) localStream.getTracks().forEach(t => t.stop());
  participants.clear();
  peerConnections.clear();
  showLobby(); 
}

document.getElementById('leaveRoomBtn').onclick = leaveRoom;
function copyRoomCode() { navigator.clipboard.writeText(roomCode); toast('Code copied'); }

// Modal triggers
document.getElementById('showCreateBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
document.getElementById('showJoinBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
document.getElementById('createCardBtn').onclick = () => document.getElementById('createModal').classList.remove('hidden');
document.getElementById('joinCardBtn').onclick = () => document.getElementById('joinModal').classList.remove('hidden');
document.getElementById('cancelCreateModal').onclick = closeAllModals;
document.getElementById('cancelJoinModal').onclick = closeAllModals;
document.getElementById('confirmCreateModal').onclick = createRoom;
document.getElementById('confirmJoinModal').onclick = joinRoom;
document.getElementById('joinRoomCode').addEventListener('input', e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''));

// Auto-join from URL
const urlParams = new URLSearchParams(window.location.search);
const autoCode = urlParams.get('join');
if(autoCode && autoCode.length === 6) setTimeout(() => { 
  document.getElementById('joinRoomCode').value = autoCode.toUpperCase(); 
  document.getElementById('joinModal').classList.remove('hidden'); 
  toast('Enter your name to join'); 
}, 300);
</script>
</body>
</html>
